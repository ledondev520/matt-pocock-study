-primary,#5129C5); }.arch-d06-spec-lifecycle-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d06-spec-lifecycle-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }.arch-d06-spec-lifecycle-zh .export-note.export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }</style><defs><marker id="arch-d06-spec-lifecycle-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d06-spec-lifecycle-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">决策、规格与工单的生命周期</tspan></text><g aria-hidden="true"><path d="M195 120V164" class="a-emphasis export-edge" marker-end="url(#arch-d06-spec-lifecycle-zh-arrow)"/><path d="M195 226V270" class="a-emphasis export-edge" marker-end="url(#arch-d06-spec-lifecycle-zh-arrow)"/><path d="M195 332V376" class="a-emphasis export-edge" marker-end="url(#arch-d06-spec-lifecycle-zh-arrow)"/><path d="M195 424V468" class="a-emphasis export-edge" marker-end="url(#arch-d06-spec-lifecycle-zh-arrow)"/><path d="M336 96H350V605H336" class="a-emphasis export-edge" marker-end="url(#arch-d06-spec-lifecycle-zh-arrow)"/></g><g><g id="arch-d06-spec-lifecycle-zh-node-decisions"><rect x="54" y="72" width="282" height="48" rx="9" class="c-frontend export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">已定决策</tspan></text></g><g id="arch-d06-spec-lifecycle-zh-node-spec"><rect x="54" y="164" width="282" height="62" rx="9" class="c-frontend export-box"/><text x="66" y="187" class="t-primary export-label"><tspan x="66" dy="0">规格</tspan></text><text x="66" y="207" class="t-primary export-detail"><tspan x="66" dy="0">目标 · 行为 · 范围外 · 验收</tspan></text></g><g id="arch-d06-spec-lifecycle-zh-node-tickets"><rect x="54" y="270"