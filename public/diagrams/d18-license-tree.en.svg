<svg xmlns="http://www.w3.org/2000/svg" class="arch-d18-license-tree-en" role="img" aria-labelledby="arch-d18-license-tree-en-title arch-d18-license-tree-en-desc" viewBox="0 0 390 722"><title id="arch-d18-license-tree-en-title">Check licenses before reuse</title><desc id="arch-d18-license-tree-en-desc">A hierarchy diagram generated by Archify.</desc><style>.arch-d18-license-tree-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d18-license-tree-en .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-d18-license-tree-en .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d18-license-tree-en .c-external { fill: var(--muted); stroke: var(--primary); }.arch-d18-license-tree-en .t-primary { fill: var(--foreground); }.arch-d18-license-tree-en { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d18-license-tree-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d18-license-tree-en .export-title { font-size: 18px; font-weight: 700; }.arch-d18-license-tree-en .export-label { font-size: 14px; font-weight: 650; }.arch-d18-license-tree-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d18-license-tree-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-license-tree-en .export-decision { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-license-tree-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d18-license-tree-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d18-license-tree-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }</sty