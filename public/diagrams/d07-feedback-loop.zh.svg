<svg xmlns="http://www.w3.org/2000/svg" class="arch-d07-feedback-loop-zh" role="img" lang="zh-CN" aria-labelledby="arch-d07-feedback-loop-zh-title arch-d07-feedback-loop-zh-desc" viewBox="0 0 390 986" data-layout-contract="compact-reader-v1"><title id="arch-d07-feedback-loop-zh-title">检查通过，才有行为证据</title><desc id="arch-d07-feedback-loop-zh-desc">由 Archify 生成的工作流图。</desc><style>.arch-d07-feedback-loop-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d07-feedback-loop-zh .c-backend { fill: var(--card-accent); stroke: var(--primary); }.arch-d07-feedback-loop-zh .c-security { fill: var(--card-accent); stroke: var(--pink); }.arch-d07-feedback-loop-zh .t-primary { fill: var(--foreground); }.arch-d07-feedback-loop-zh .a-emphasis { stroke: var(--primary); fill: none; }.arch-d07-feedback-loop-zh { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d07-feedback-loop-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d07-feedback-loop-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d07-feedback-loop-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d07-feedback-loop-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d07-feedback-loop-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d07-feedback-loop-zh .export-success .export-box { fill: var(--lime,#C6F432); }.arch-d07-feedback-loop-zh .export-success text { fill: #241b35; }.arch-d07-feedback-loop-zh .export-decision { fill: var(--card-accent,#F8F7FC); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d07-feedback-loop-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d07-feedback-loop-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d07-feedback-loop-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d07-feedback-loop-zh .export-note { fill: var(--card-accent,#F8F7FC); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d07-feedback-loop-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d07-feedback-loop-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">检查通过，才有行为证据</tspan></text><g aria-hidden="true"><path d="M195 120V164" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-zh-arrow)"/><path d="M195 212V256" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-zh-arrow)"/><path d="M195 304V348" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-zh-arrow)"/><path d="M195 396V440" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-zh-arrow)"/><path d="M195 540V584" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-zh-arrow)"/><path d="M54 490H19V280H54" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-zh-arrow)"/></g><g><g id="arch-d07-feedback-loop-zh-node-ticket" data-node="ticket"><rect x="54" y="72" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">边界清楚的工单</tspan></text></g><g id="arch-d07-feedback-loop-zh-node-expect" data-node="expect"><rect x="54" y="164" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="187" class="t-primary export-label"><tspan x="66" dy="0">复现或建立预期</tspan></text></g><g id="arch-d07-feedback-loop-zh-node-implement" data-node="implement"><rect x="54" y="256" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="279" class="t-primary export-label"><tspan x="66" dy="0">实现</tspan></text></g><g id="arch-d07-feedback-loop-zh-node-check" data-node="check"><rect x="54" y="348" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="371" class="t-primary export-label"><tspan x="66" dy="0">检查</tspan></text></g><g id="arch-d07-feedback-loop-zh-node-pass" data-node="pass"><path d="M195 440L336 490L195 540L54 490Z" class="c-security export-box export-decision"/><text x="116.03999999999999" y="494" class="t-primary export-label"><tspan x="116.03999999999999" dy="0">通过？</tspan></text></g><g id="arch-d07-feedback-loop-zh-node-evidence" data-node="evidence" class="export-success"><rect x="54" y="584" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="607" class="t-primary export-label"><tspan x="66" dy="0">✓ 行为证据</tspan></text></g><text x="205" y="567" class="t-primary export-detail"><tspan x="205" dy="0">是</tspan></text></g><g><rect x="24" y="676" width="342" height="76" rx="8" class="export-note"/><text x="36" y="700" class="t-primary export-label"><tspan x="36" dy="0">TypeScript 项目</tspan></text><text x="36" y="722" class="t-primary export-detail"><tspan x="36" dy="0">类型检查、相关测试、格式与 lint。</tspan></text></g><g><rect x="24" y="770" width="342" height="96" rx="8" class="export-note"/><text x="36" y="794" class="t-primary export-label"><tspan x="36" dy="0">交互行为</tspan></text><text x="36" y="816" class="t-primary export-detail"><tspan x="36" dy="0">开发服务器、可读日志、冒烟 CLI。</tspan></text><text x="36" y="836" class="t-primary export-detail"><tspan x="36" dy="0">检查要能发现有意义的错误。</tspan></text></g><g><rect x="24" y="884" width="342" height="76" rx="8" class="export-note"/><text x="36" y="908" class="t-primary export-label"><tspan x="36" dy="0">通过？ → 实现</tspan></text><text x="36" y="930" class="t-primary export-detail"><tspan x="36" dy="0">否：修复