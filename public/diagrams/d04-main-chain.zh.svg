<svg xmlns="http://www.w3.org/2000/svg" class="arch-d04-main-chain-zh" role="img" aria-labelledby="arch-d04-main-chain-zh-title arch-d04-main-chain-zh-desc" viewBox="0 0 390 1090"><title id="arch-d04-main-chain-zh-title">从对齐走到可评审的 PR</title><desc id="arch-d04-main-chain-zh-desc">由 Archify 生成的工作流图。</desc><style>.arch-d04-main-chain-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d04-main-chain-zh .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d04-main-chain-zh .t-primary { fill: var(--foreground); }.arch-d04-main-chain-zh .a-emphasis { stroke: var(--primary); fill: none; }.arch-d04-main-chain-zh { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d04-main-chain-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d04-main-chain-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d04-main-chain-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d04-main-chain-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d04-main-chain-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d04-main-chain-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d04-main-chain-zh .export-dashed { stroke-dasharray: 6, 4; }.arch-d04-main-chain-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d04-main-chain-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d04-main-chain-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d04-main-chain-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d04-main-chain-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">从对齐走到可评审的 PR</tspan></text><g aria-hidden="true"><path d="M195 134V178" class="a-emphasis export-edge" marker-end="url(#arch-d04-main-chain-zh-arrow)"/><path d="M195 260V304" class="a-emphasis export-edge" marker-end="url(#arch-d04-main-chain-zh-arrow)"/><path d="M195 366V410" class="a-emphasis export-edge" marker-end="url(#arch-d04-main-chain-zh-arrow)"/><path d="M195 472V516" class="a-emphasis export-edge" marker-end="url(#arch-d04-main-chain-zh-arrow)"/><path d="M195 578V622" class="a-emphasis export-edge" marker-end="url(#arch-d04-main-chain-zh-arrow)"/><path d="M54 779H19V219H54" class="a-emphasis export-edge export-dashed" marker-end="url(#arch-d04-main-chain-zh-arrow)"/></g><g><g id="arch-d04-main-chain-zh-node-align"><rect x="54" y="72" width="282" height="62" rx="9" class="c-backend export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">对齐</tspan></text><text x="66" y="115" class="t-primary export-detail"><tspan x="66" dy="0">模糊请求 → 已确认决策</tspan></text></g><g id="arch-d04-main-chain-zh-node-spec"><rect x="54" y="178" width="282" height="82" rx="9" class="c-backend export-box"/><text x="66" y="201" class="t-primary export-label"><tspan x="66" dy="0">规格</tspan></text><text x="66" y="221" class="t-primary export-detail"><tspan x="66" dy="0">已定决策 → 目标、行为、范围外、验收</tspan><tspan x="66" dy="20">方式</tspan></text></g><g id="arch-d04-main-chain-zh-node-ticket"><rect x="54" y="304" width="282" height="62" rx="9" class="c-backend export-box"/><text x="66" y="327" class="t-primary export-label"><tspan x="66" dy="0">实施工单</tspan></text><text x="66" y="347" class="t-primary export-detail"><tspan x="66" dy="0">规格 → 可独立验收的纵向能力</tspan></text></g><g id="arch-d04-main-chain-zh-node-implement"><rect x="54" y="410" width="282" height="62" rx="9" class="c-backend export-box"/><text x="66" y="433" class="t-primary export-label"><tspan x="66" dy="0">实现</tspan></text><text x="66" y="453" class="t-primary export-detail"><tspan x="66" dy="0">边界清楚的工单 → 通过相关检查的改动</tspan></text></g><g id="arch-d04-main-chain-zh-node-review"><rect x="54" y="516" width="282" height="62" rx="9" class="c-backend export-box"/><text x="66" y="539" class="t-primary export-label"><tspan x="66" dy="0">评审</tspan></text><text x="66" y="559" class="t-primary export-detail"><tspan x="66" dy="0">改动与依据 → 需求、规范两条结论</tspan></text></g><g id="arch-d04-main-chain-zh-node-pr"><rect x="54" y="622" width="282" height="82" rx="9" class="c-backend export-box"/><text x="66" y="645" class="t-primary export-label"><tspan x="66" dy="0">PR</tspan></text><text x="66" y="665" class="t-primary export-detail"><tspan x="66" dy="0">评审与行为证据 → 变化概览、前后证据</tspan><tspan x="66" dy="20">、合并风险</tspan></text></g><g id="arch-d04-main-chain-zh-node-wayfinder"><rect x="54" y="748" width="282" height="62" rx="9" class="c-backend export-box"/><text x="66" y="771" class="t-primary export-label"><tspan x="66" dy="0">/wayfinder</tspan></text><text x="66" y="791" class="t-primary export-detail"><tspan x="66" dy="0">地图索引 · 依赖 · 未决问题</tspan></text></g></g><g><rect x="24" y="854" width="342" height="116" rx="8" class="export-note"/><text x="36" y="878" class="t-primary export-label"><tspan x="36" dy="0">工单用途不同</tspan></text><text x="36" y="900" class="t-primary export-detail"><tspan x="36" dy="0">决策工单 ≠ 实现工单；斜杠命令只是入口。</tspan></text><text x="36" y="920" class="t-primary export-detail"><tspan x="36" dy="0">规格：目标、行为、范围外、验收方式。</tspan></text><text x="36" y="940" class="t-primary export-detail"><tspan x="36" dy="0">PR：变化概览、前后证据、合并风险。</tspan></text></g><g><rect x="24" y="988" width="342" height="76" rx="8" class="export-note"/><text x="36" y="1012" class="t-primary export-label"><tspan x="36" dy="0">/wayfinder → 规格</tspan></text><text x="36" y="1034" class="t-primary export-detail"><tspan x="36" dy="0">跨会话决策</tspan></text></g></svg>
