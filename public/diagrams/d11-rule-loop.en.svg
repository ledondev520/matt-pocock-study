 round; }.arch-d11-rule-loop-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d11-rule-loop-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d11-rule-loop-en .export-note { fill: var(--card-accent,#F8F7FC); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d11-rule-loop-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d11-rule-loop-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Turn a real failure into an effective</tspan><tspan x="24" dy="20">rule</tspan></text><g aria-hidden="true"><path d="M195 140V184" class="a-emphasis export-edge" marker-end="url(#arch-d11-rule-loop-en-arrow)"/><path d="M195 316V360" class="a-emphasis export-edge" marker-end="url(#arch-d11-rule-loop-en-arrow)"/><path d="M336 250H360V476H336" class="a-emphasis export-edge" marker-end="url(#arch-d11-rule-loop-en-arrow)"/><path d="M336 384H365V575H336" class="a-emphasis export-edge" marker-end="url(#arch-d11-rule-loop-en-arrow)"/><path d="M195 500V544" class="a-emphasis export-edge" marker-end="url(#arch-d11-rule-loop-en-arrow)"/><path d="M195 606V650" class="a-emphasis export-edge" marker-end="url(#arch-d11-rule-loop-en-arrow)"/><path d="M54 674H24V116H54" class="a-emphasis export-edge" marker-end="url(#arch-d11-rule-loop-en-arrow)"/></g><g><g id="arch-d11-rule-loop-en-node-failure" data-node="failure"><rect x="54" y="92" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="115" class="t-primary export-label"><tspan x="66" dy="0">Real failure</tspan></text></g><g id="arch-d11-rule-loop-en-node-mechanical" data-node="mechanical"><path d="M195 184L336 250L195 316L54 250Z" class="c-security export-box export-decision"/><text x="116.03999999999999" y