<svg xmlns="http://www.w3.org/2000/svg" class="arch-d05-alignment-flow-en" role="img" lang="en" aria-labelledby="arch-d05-alignment-flow-en-title arch-d05-alignment-flow-en-desc" viewBox="0 0 390 956" data-layout-contract="compact-reader-v1"><title id="arch-d05-alignment-flow-en-title">Turn a vague request into agreed behavior</title><desc id="arch-d05-alignment-flow-en-desc">A workflow diagram generated by Archify.</desc><style>.arch-d05-alignment-flow-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d05-alignment-flow-en .c-backend { fill: var(--card-accent); stroke: var(--primary); }.arch-d05-alignment-flow-en .t-primary { fill: var(--foreground); }.arch-d05-alignment-flow-en .a-emphasis { stroke: var(--primary); fill: none; }.arch-d05-alignment-flow-en { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d05-alignment-flow-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d05-alignment-flow-en .export-title { font-size: 18px; font-weight: 700; }.arch-d05-alignment-flow-en .export-label { font-size: 14px; font-weight: 650; }.arch-d05-alignment-flow-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d05-alignment-flow-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d05-alignment-flow-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d05-alignment-flow-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d05-alignment-flow-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d05-alignment-flow-en .export-note { fill: var(--card-accent,#F8F7FC); stroke: var(--border,#DCD6E7); }</style