<svg xmlns="http://www.w3.org/2000/svg" class="arch-d15-states-en" role="img" aria-labelledby="arch-d15-states-en-title arch-d15-states-en-desc" viewBox="0 0 390 1152"><title id="arch-d15-states-en-title">Request states and transitions</title><desc id="arch-d15-states-en-desc">A lifecycle diagram generated by Archify.</desc><style>.arch-d15-states-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d15-states-en .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-d15-states-en .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d15-states-en .c-security { fill: var(--muted); stroke: var(--pink); }.arch-d15-states-en .t-primary { fill: var(--foreground); }.arch-d15-states-en .a-emphasis { stroke: var(--primary); fill: none; }.arch-d15-states-en { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d15-states-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d15-states-en .export-title { font-size: 18px; font-weight: 700; }.arch-d15-states-en .export-label { font-size: 14px; font-weight: 650; }.arch-d15-states-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d15-states-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d15-states-en .export-success .export-box { fill: var(--lime,#C6F432); }.arch-d15-states-en .export-success text { fill: #241b35; }.arch-d15-states-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d15-states-en .export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }.arch-d15-states-en .export-dashed { stroke-dasharray: 6, 4; }.arch-d15-states-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d15-states-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d15-states-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d15-states-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d15-states-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Request states and transitions</tspan></text><g aria-hidden="true"><path d="M195 120V164" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-en-arrow)"/><path d="M195 212V256" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-en-arrow)"/><path d="M336 188H360V372H336" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-en-arrow)"/><path d="M54 372H29V188H54" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-en-arrow)"/><path d="M54 280H14V96H54" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-en-arrow)"/><path d="M336 96H355V280H336" class="a-emphasis export-edge export-dashed" marker-end="url(#arch-d15-states-en-arrow)"/></g><g><g id="arch-d15-states-en-node-idle"><rect x="54" y="72" width="282" height="48" rx="9" class="c-frontend export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">idle</tspan></text></g><g id="arch-d15-states-en-node-loading"><rect x="54" y="164" width="282" height="48" rx="9" class="c-frontend export-box"/><text x="66" y="187" class="t-primary export-label"><tspan x="66" dy="0">loading</tspan></text></g><g id="arch-d15-states-en-node-success" class="export-success"><rect x="54" y="256" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="279" class="t-primary export-label"><tspan x="66" dy="0">success</tspan></text></g><g id="arch-d15-states-en-node-error"><rect x="54" y="348" width="282" height="48" rx="9" class="c-security export-box export-wrong"/><text x="66" y="371" class="t-primary export-label"><tspan x="66" dy="0">error</tspan></text></g><text x="205" y="147" class="t-primary export-detail"><tspan x="205" dy="0">submit</tspan></text><text x="205" y="239" class="t-primary export-detail"><tspan x="205" dy="0">resolve</tspan></text></g><g><rect x="24" y="440" width="342" height="116" rx="8" class="export-note"/><text x="36" y="464" class="t-primary export-label"><tspan x="36" dy="0">Representation</tspan></text><text x="36" y="486" class="t-primary export-detail"><tspan x="36" dy="0">Use a discriminated union, reducer or state</tspan><tspan x="36" dy="20">machine.</tspan></text><text x="36" y="526" class="t-primary export-detail"><tspan x="36" dy="0">Keep simple cases simple.</tspan></text></g><g><rect x="24" y="574" width="342" height="136" rx="8" class="export-note"/><text x="36" y="598" class="t-primary export-label"><tspan x="36" dy="0">Original example</tspan></text><text x="36" y="620" class="t-primary export-detail"><tspan x="36" dy="0">Our original request table; events absent from</tspan><tspan x="36" dy="20">it leave state unchanged.</tspan></text><text x="36" y="660" class="t-primary export-detail"><tspan x="36" dy="0">Only success carries results; only error carries</tspan><tspan x="36" dy="20">an error.</tspan></text></g><g><rect x="24" y="728" width="342" height="76" rx="8" class="export-note"/><text x="36" y="752" class="t-primary export-label"><tspan x="36" dy="0">loading → error</tspan></text><text x="36" y="774" class="t-primary export-detail"><tspan x="36" dy="0">reject</tspan></text></g><g><rect x="24" y="822" width="342" height="76" rx="8" class="export-note"/><text x="36" y="846" class="t-primary export-label"><tspan x="36" dy="0">error → loading</tspan></text><text x="36" y="868" class="t-primary export-detail"><tspan x="36" dy="0">retry</tspan></text></g><g><rect x="24" y="916" width="342" height="76" rx="8" class="export-note"/><text x="36" y="940" class="t-primary export-label"><tspan x="36" dy="0">success → idle</tspan></text><text x="36" y="962" class="t-primary export-detail"><tspan x="36" dy="0">reset</tspan></text></g><g><rect x="24" y="1010" width="342" height="116" rx="8" class="export-note"/><text x="36" y="1034" class="t-primary export-label"><tspan x="36" dy="0">idle → success</tspan></text><text x="36" y="1056" class="t-primary export-detail"><tspan x="36" dy="0">× resolve: illegal transition</tspan></text><text x="36" y="1076" class="t-primary export-detail"><tspan x="36" dy="0">Ignore the event; retain idle. Tests must catch</tspan><tspan x="36" dy="20">early success.</tspan></text></g></svg>
