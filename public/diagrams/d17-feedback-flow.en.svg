<svg xmlns="http://www.w3.org/2000/svg" class="arch-d17-feedback-flow-en" role="img" aria-labelledby="arch-d17-feedback-flow-en-title arch-d17-feedback-flow-en-desc" viewBox="0 0 390 1098"><title id="arch-d17-feedback-flow-en-title">Turn feedback into change candidates</title><desc id="arch-d17-feedback-flow-en-desc">A workflow diagram generated by Archify.</desc><style>.arch-d17-feedback-flow-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d17-feedback-flow-en .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d17-feedback-flow-en .c-security { fill: var(--muted); stroke: var(--pink); }.arch-d17-feedback-flow-en .t-primary { fill: var(--foreground); }.arch-d17-feedback-flow-en .a-emphasis { stroke: var(--primary); fill: none; }.arch-d17-feedback-flow-en { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d17-feedback-flow-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d17-feedback-flow-en .export-title { font-size: 18px; font-weight: 700; }.arch-d17-feedback-flow-en .export-label { font-size: 14px; font-weight: 650; }.arch-d17-feedback-flow-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d17-feedback-flow-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d17-feedback-flow-en .export-success .export-box { fill: var(--lime,#C6F432); }.arch-d17-feedback-flow-en .export-success text { fill: #241b35; }.arch-d17-feedback-flow-en .export-decision { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d17-feedback-flow-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d17-feedback-flow-en .export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }.arch-d17-feedback-flow-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d17-feedback-flow-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d17-feedback-flow-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d17-feedback-flow-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d17-feedback-flow-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Turn feedback into change</tspan><tspan x="24" dy="20">candidates</tspan></text><g aria-hidden="true"><path d="M195 140V184" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-en-arrow)"/><path d="M195 232V276" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-en-arrow)"/><path d="M195 324V368" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-en-arrow)"/><path d="M195 468V512" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-en-arrow)"/><path d="M336 418H350V628H336" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-en-arrow)"/><path d="M336 116H355V720H336" class="a-emphasis export-edge export-wrong" marker-end="url(#arch-d17-feedback-flow-en-wrong)"/></g><g><g id="arch-d17-feedback-flow-en-node-feedback"><rect x="54" y="92" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="115" class="t-primary export-label"><tspan x="66" dy="0">Negative feedback</tspan></text></g><g id="arch-d17-feedback-flow-en-node-respond"><rect x="54" y="184" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="207" class="t-primary export-label"><tspan x="66" dy="0">Address the issue</tspan></text></g><g id="arch-d17-feedback-flow-en-node-context"><rect x="54" y="276" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="299" class="t-primary export-label"><tspan x="66" dy="0">Ask for context</tspan></text></g><g id="arch-d17-feedback-flow-en-node-reproduce"><path d="M195 368L336 418L195 468L54 418Z" class="c-security export-box export-decision"/><text x="116.03999999999999" y="422" class="t-primary export-label"><tspan x="116.03999999999999" dy="0">Reproducible?</tspan></text></g><g id="arch-d17-feedback-flow-en-node-candidate" class="export-success"><rect x="54" y="512" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="535" class="t-primary export-label"><tspan x="66" dy="0">✓ Change candidate</tspan></text></g><g id="arch-d17-feedback-flow-en-node-evidence"><rect x="54" y="604" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="627" class="t-primary export-label"><tspan x="66" dy="0">Ask for evidence</tspan></text></g><g id="arch-d17-feedback-flow-en-node-argue"><rect x="54" y="696" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="719" class="t-primary export-label"><tspan x="66" dy="0">× Only argue back</tspan></text></g><text x="205" y="495" class="t-primary export-detail"><tspan x="205" dy="0">Yes</tspan></text></g><g><rect x="24" y="788" width="342" height="96" rx="8" class="export-note"/><text x="36" y="812" class="t-primary export-label"><tspan x="36" dy="0">Evidence limit</tspan></text><text x="36" y="834" class="t-primary export-detail"><tspan x="36" dy="0">One like or one case does not prove</tspan><tspan x="36" dy="20">effectiveness.</tspan></text></g><g><rect x="24" y="902" width="342" height="76" rx="8" class="export-note"/><text x="36" y="926" class="t-primary export-label"><tspan x="36" dy="0">Reproducible? → Ask for evidence</tspan></text><text x="36" y="948" class="t-primary export-detail"><tspan x="36" dy="0">No</tspan></text></g><g><rect x="24" y="996" width="342" height="76" rx="8" class="export-note"/><text x="36" y="1020" class="t-primary export-label"><tspan x="36" dy="0">Negative feedback → × Only argue back</tspan></text><text x="36" y="1042" class="t-primary export-detail"><tspan x="36" dy="0">Avoid</tspan></text></g></svg>
