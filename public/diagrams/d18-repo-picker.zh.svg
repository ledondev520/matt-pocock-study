<svg xmlns="http://www.w3.org/2000/svg" class="arch-d18-repo-picker-zh" role="img" aria-labelledby="arch-d18-repo-picker-zh-title arch-d18-repo-picker-zh-desc" viewBox="0 0 390 736"><title id="arch-d18-repo-picker-zh-title">按问题选择仓库</title><desc id="arch-d18-repo-picker-zh-desc">由 Archify 生成的层级结构图。</desc><style>.arch-d18-repo-picker-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d18-repo-picker-zh .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-d18-repo-picker-zh .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d18-repo-picker-zh .c-external { fill: var(--muted); stroke: var(--primary); }.arch-d18-repo-picker-zh .t-primary { fill: var(--foreground); }.arch-d18-repo-picker-zh { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d18-repo-picker-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d18-repo-picker-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d18-repo-picker-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d18-repo-picker-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d18-repo-picker-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-repo-picker-zh .export-decision { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-repo-picker-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d18-repo-picker-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d18-repo-picker-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d18-repo-picker-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d18-repo-picker-zh-arrow" viewBox="0 0 8 8