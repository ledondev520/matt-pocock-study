<svg xmlns="http://www.w3.org/2000/svg" class="arch-d04-timeline-en" role="img" aria-labelledby="arch-d04-timeline-en-title arch-d04-timeline-en-desc" viewBox="0 0 390 862"><title id="arch-d04-timeline-en-title">How the workflow evolved</title><desc id="arch-d04-timeline-en-desc">An event timeline generated by Archify.</desc><style>.arch-d04-timeline-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d04-timeline-en .c-external { fill: var(--muted); stroke: var(--primary); }.arch-d04-timeline-en .t-primary { fill: var(--foreground); }.arch-d04-timeline-en { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d04-timeline-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d04-timeline-en .export-title { font-size: 18px; font-weight: 700; }.arch-d04-timeline-en .export-label { font-size: 14px; font-weight: 650; }.arch-d04-timeline-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d04-timeline-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d04-timeline-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d04-timeline-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d04-timeline-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d04-timeline-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d04-timeline-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d04-timeline-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></de