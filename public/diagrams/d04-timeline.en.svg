/g><g><rect x="24" y="531.0434782608695" width="342" height="96" rx="8" class="export-note"/><text x="36" y="555.0434782608695" class="t-primary export-label"><tspan x="36" dy="0">Date precision</tspan></text><text x="36" y="577.0434782608695" class="t-primary export-detail"><tspan x="36" dy="0">January and spring are broad phases; axis</tspan><tspan x="36" dy="20">dates are placement anchors.</tspan></text></g><g><rect x="24" y="645.0434782608695" width="342" height="76" rx="8" class="export-note"/><text x="36" y="669.0434782608695" class="t-primary export-label"><tspan x="36" dy="0">Matt Pocock · 2026-07-02</tspan></text><text x="36" y="691.0434782608695" class="t-primary export-detail"><tspan x="36" dy="0">Source link: see the matching candidate.</tspan></text></g><g><rect x="24" y="739.0434782608695" width="342" height="96" rx="8" class="export-note"/><text x="36" y="763.0434782608695" class="t-primary export-label"><tspan x="36" dy="0">Time scale</tspan></text><text x="36" y="785.0434782608695" class="t-primary export-detail"><tspan x="36" dy="0">Vertical spacing is proportional to candidate</tspan><tspan x="36" dy="20">dates; phase dates are placement anchors.</tspan></text></g></svg>
