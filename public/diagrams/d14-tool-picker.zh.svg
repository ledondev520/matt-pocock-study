<svg xmlns="http://www.w3.org/2000/svg" class="arch-d14-tool-picker-zh" role="img" aria-labelledby="arch-d14-tool-picker-zh-title arch-d14-tool-picker-zh-desc" viewBox="0 0 390 482"><title id="arch-d14-tool-picker-zh-title">按问题选择类型工具</title><desc id="arch-d14-tool-picker-zh-desc">工具各有用途，也各有边界。</desc><style>.arch-d14-tool-picker-zh { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d14-tool-picker-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d14-tool-picker-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d14-tool-picker-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d14-tool-picker-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d14-tool-picker-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d14-tool-picker-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d14-tool-picker-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d14-tool-picker-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d14-tool-picker-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">按问题选择类型工具</tspan></text><g aria-hidden="true"/><g/><g><rect x="24" y="72" width="342" height="116" rx="8" class="export-note"/><text x="36" y="96" class="t-primary export-label"><tspan x="36" dy="0">字符串 ID 混用</tspan></text><text x="36" y="118" class="t-primary export-detail"><tspan x="36" dy="0">工具: branded types</tspan></text><text x="36" y="138" class="t-primary export-detail"><tspan x="36" dy="0">它做什么: 静态区分领域值</tspan></text><text x="36" y="158" class="t-primary export-detail"><tspan x="36" dy="0">它没解决什么: 不验证网络输入</tspan></text></g><g><rect x="24" y="206" width="342" height="116" rx="8" class="export-note"/><text x="36" y="230" class="t-primary export-label"><tspan x="36" dy="0">字面量被放宽</tspan></text><text x="36" y="252" class="t-primary export-detail"><tspan x="36" dy="0">工具: `as const`</tspan></text><text x="36" y="272" class="t-primary export-detail"><tspan x="36" dy="0">它做什么: 保留字面量信息</tspan></text><text x="36" y="292" class="t-primary export-detail"><tspan x="36" dy="0">它没解决什么: readonly ≠ 运行时冻结</tspan></text></g><g><rect x="24" y="340" width="342" height="116" rx="8" class="export-note"/><text x="36" y="364" class="t-primary export-label"><tspan x="36" dy="0">对象键不完整</tspan></text><text x="36" y="386" class="t-primary export-detail"><tspan x="36" dy="0">工具: `PropertyKey`</tspan></text><text x="36" y="406" class="t-primary export-detail"><tspan x="36" dy="0">它做什么: 涵盖 string、number、symbol</tspan></text><text x="36" y="426" class="t-primary export-detail"><tspan x="36" dy="0">它没解决什么: 类型能表达 ≠ 运行时支持</tspan></text></g></svg>
