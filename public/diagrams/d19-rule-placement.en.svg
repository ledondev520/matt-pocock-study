<svg xmlns="http://www.w3.org/2000/svg" class="arch-d19-rule-placement-en" role="img" aria-labelledby="arch-d19-rule-placement-en-title arch-d19-rule-placement-en-desc" viewBox="0 0 390 550"><title id="arch-d19-rule-placement-en-title">Where a rule belongs</title><desc id="arch-d19-rule-placement-en-desc">Place each rule according to its purpose.</desc><style>.arch-d19-rule-placement-en { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d19-rule-placement-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d19-rule-placement-en .export-title { font-size: 18px; font-weight: 700; }.arch-d19-rule-placement-en .export-label { font-size: 14px; font-weight: 650; }.arch-d19-rule-placement-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d19-rule-placement-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d19-rule-placement-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d19-rule-placement-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d19-rule-placement-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d19-rule-placement-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Where a rule belongs</tspan></text><g aria-hidden="true"/><g/><g><rect x="24" y="72" width="342" height="76" rx="8" class="export-note"/><text x="36" y="96" class="t-primary export-label"><tspan x="36" dy="0">Navigation</tspan></text><text x="36" y="118" class="t-primary export-detail"><tspan x="36" dy="0">Where it goes: AGENTS.md</tspan></text></g><g><rect x="24" y="166" width="342" height="76" rx="8" class="export-note"/><text x="36" y="190" class="t-primary export-label"><tspan x="36" dy="0">Rules requiring judgment</tspan></text><text x="36" y="212" class="t-primary export-detail"><tspan x="36" dy="0">Where it goes: CODING_STANDARDS</tspan></text></g><g><rect x="24" y="260" width="342" height="76" rx="8" class="export-note"/><text x="36" y="284" class="t-primary export-label"><tspan x="36" dy="0">Mechanically enforceable rules</tspan></text><text x="36" y="306" class="t-primary export-detail"><tspan x="36" dy="0">Where it goes: lint / hook / CI</tspan></text></g><g><rect x="24" y="354" width="342" height="76" rx="8" class="export-note"/><text x="36" y="378" class="t-primary export-label"><tspan x="36" dy="0">Long-term rationale</tspan></text><text x="36" y="400" class="t-primary export-detail"><tspan x="36" dy="0">Where it goes: ADR</tspan></text></g><g><rect x="24" y="448" width="342" height="76" rx="8" class="export-note"/><text x="36" y="472" class="t-primary export-label"><tspan x="36" dy="0">Domain language</tspan></text><text x="36" y="494" class="t-primary export-detail"><tspan x="36" dy="0">Where it goes: GLOSSARY</tspan></text></g></svg>
