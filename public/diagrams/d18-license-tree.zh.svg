<svg xmlns="http://www.w3.org/2000/svg" class="arch-d18-license-tree-zh" role="img" lang="zh-CN" aria-labelledby="arch-d18-license-tree-zh-title arch-d18-license-tree-zh-desc" viewBox="0 0 390 608" data-layout-contract="compact-reader-v1"><title id="arch-d18-license-tree-zh-title">先看许可，再谈复用</title><desc id="arch-d18-license-tree-zh-desc">由 Archify 生成的层级结构图。</desc><style>.arch-d18-license-tree-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d18-license-tree-zh .c-frontend { fill: var(--card-accent); stroke: var(--primary); }.arch-d18-license-tree-zh .c-backend { fill: var(--card-accent); stroke: var(--primary); }.arch-d18-license-tree-zh .c-external { fill: var(--card-accent); stroke: var(--primary); }.arch-d18-license-tree-zh .t-primary { fill: var(--foreground); }.arch-d18-license-tree-zh { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d18-license-tree-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d18-license-tree-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d18-license-tree-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d18-license-tree-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d18-license-tree-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-license-tree-zh .export-decision { fill: var(--card-accent,#F8F7FC); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-license-tree-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d18-license-tree-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d18-license-tree-zh .export-wrong-ar