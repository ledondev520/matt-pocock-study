ry export-title"><tspan x="24" dy="0">工作流逐步演变</tspan></text><g aria-hidden="true"><path d="M30 103V456.04347826086956" class="export-edge"/><path d="M25 103H54" class="export-edge"/><path d="M25 216.47826086956522H54" class="export-edge"/><path d="M25 332.47826086956525H54" class="export-edge"/><path d="M25 456.04347826086956H54" class="export-edge"/></g><g><g id="arch-d04-timeline-zh-node-jan"><rect x="54" y="72" width="282" height="62" rx="9" class="c-external export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">2026-01 Ralph / AFK</tspan></text><text x="66" y="115" class="t-primary export-detail"><tspan x="66" dy="0">早期工作流</tspan></text></g><g id="arch-d04-timeline-zh-node-spring"><rect x="54" y="185.47826086956522" width="282" height="62" rx="9" class="c-external export-box"/><text x="66" y="208.47826086956522" class="t-primary export-label"><tspan x="66" dy="0">春季 grill / 原型</tspan></text><text x="66" y="228.47826086956522" class="t-primary export-detail"><tspan x="66" dy="0">提问与廉价原型</tspan></text></g><g id="arch-d04-timeline-zh-node-july"><rect x="54" y="291.47826086956525" width="282" height="82" rx="9" class="c-external export-box"/><text x="66" y="314.47826086956525" class="t-primary export-label"><tspan x="66" dy="0">2026-07 新命名</tspan></text><text x="66" y="334.47826086956525" class="t-primary export-detail"><tspan x="66" dy="0">/wayfinder → /to-spec → /to-tickets →</tspan><tspan x="66" dy="20">/implement → /code-review</tspan></text></g><g id="arch-d04-timeline-zh-node-oct"><rect x="54" y="425.04347826086956" width="282" height="62" rx="9" class="c-external export-box"/><text x="66" y="448.04347826086956" class="t-primary export-label"><tspan x="66" dy="0">2026-10 评审与复盘</tspan></text><text x="66" y="468.04347826086956" class="t-primary export-detail"><tspan x="66" dy="0">不要默认从 /wayfinder 开始</tspan></text></g></g><g><rect x="24" y="531.0434782608695" width="342" height="76" rx="8" class="export-note"/><text x="36" y="555.04