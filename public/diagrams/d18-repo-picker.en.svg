<svg xmlns="http://www.w3.org/2000/svg" class="arch-d18-repo-picker-en" role="img" aria-labelledby="arch-d18-repo-picker-en-title arch-d18-repo-picker-en-desc" viewBox="0 0 390 812"><title id="arch-d18-repo-picker-en-title">Choose repositories by problem</title><desc id="arch-d18-repo-picker-en-desc">A hierarchy diagram generated by Archify.</desc><style>.arch-d18-repo-picker-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d18-repo-picker-en .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-d18-repo-picker-en .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d18-repo-picker-en .c-external { fill: var(--muted); stroke: var(--primary); }.arch-d18-repo-picker-en .t-primary { fill: var(--foreground); }.arch-d18-repo-picker-en { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d18-repo-picker-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d18-repo-picker-en .export-title { font-size: 18px; font-weight: 700; }.arch-d18-repo-picker-en .export-label { font-size: 14px; font-weight: 650; }.arch-d18-repo-picker-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d18-repo-picker-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-repo-picker-en .export-decision { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d18-repo-picker-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d18-repo-picker-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d18-repo-picker-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d18-repo-picker-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d18-repo-picker-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d18-repo-picker-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Choose repositories by problem</tspan></text><g aria-hidden="true"><path d="M36 122H24V241H54" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M198 241H210V234H222" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M36 122H24V337H54" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M198 337H210V330H222" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M36 122H24V433H54" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M198 433H210V426H222" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M36 122H24V529H54" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M198 529H210V522H222" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M36 122H24V625H54" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/><path d="M198 625H210V625H222" class="a-emphasis export-edge" marker-end="url(#arch-d18-repo-picker-en-arrow)"/></g><g><g id="arch-d18-repo-picker-en-node-need"><path d="M201 72L366 122L201 172L36 122Z" class="c-frontend export-box export-decision"/><text x="108.6" y="126" class="t-primary export-label"><tspan x="108.6" dy="0">What problem now?</tspan></text></g><a href="/en/agent-documents" aria-la