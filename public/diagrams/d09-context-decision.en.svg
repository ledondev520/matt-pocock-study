<svg xmlns="http://www.w3.org/2000/svg" class="arch-d09-context-decision-en" role="img" aria-labelledby="arch-d09-context-decision-en-title arch-d09-context-decision-en-desc" viewBox="0 0 390 1072"><title id="arch-d09-context-decision-en-title">Will you need this context later?</title><desc id="arch-d09-context-decision-en-desc">A hierarchy diagram generated by Archify.</desc><style>.arch-d09-context-decision-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d09-context-decision-en .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-d09-context-decision-en .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d09-context-decision-en .c-external { fill: var(--muted); stroke: var(--primary); }.arch-d09-context-decision-en .t-primary { fill: var(--foreground); }.arch-d09-context-decision-en { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d09-context-decision-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d09-context-decision-en .export-title { font-size: 18px; font-weight: 700; }.arch-d09-context-decision-en .export-label { font-size: 14px; font-weight: 650; }.arch-d09-context-decision-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d09-context-decision-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d09-context-decision-en .export-decision { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d09-context-decision-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d09-context-decision-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d09-context-decision-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d09-context-decision-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d09-context-decision-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d09-context-decision-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Will you need this context later?</tspan></text><g aria-hidden="true"><path d="M36 122H24V251H54" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M198 251H210V234H222" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M36 122H24V387H54" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M198 387H210V350H222" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M36 122H24V543H54" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M198 543H210V506H222" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M36 122H24V689H54" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M198 689H210V662H222" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M36 122H24V825H54" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/><path d="M198 825H210V798H222" class="a-emphasis export-edge" marker-end="url(#arch-d09-context-decision-en-arrow)"/></g><g><g id="arch-d09-context-decision-en-node-root"><path d="M201 72L366 122L201 172L36 122Z" class="c-frontend export-box export-decision"/><text x="108.6" y="126" class="t-primary export-label"><tspan x="108.6" dy="0">Need this context later?</tspan></text></g><g id="arch-d09-context-decision-en-node-continue"><rect x="222" y="210" width="144" height="48" rx="9" class="c-external export-box"/><text x="234" y="233" class="t-primary export-label"><tspan x="234" dy="0">Continue</tspan></text></g><g id="arch-d09-context-decision-en-node-keep"><rect x="54" y="210" width="144" height="82" rx="9" class="c-backend export-box"/><text x="66" y="233" class="t-primary export-label"><tspan x="66" dy="0">The same small</tspan><tspan x="66" dy="20">loop still needs</tspan><tspan x="66" dy="20">current details</tspan></text></g><g id="arch-d09-context-decision-en-node-clear"><rect x="222" y="326" width="144" height="48" rx="9" class="c-external export-box"/><text x="234" y="349" class="t-primary export-label"><tspan x="234" dy="0">Clean up</tspan></text></g><g id="arch-d09-context-decision-en-node-reset"><rect x="54" y="326" width="144" height="122" rx="9" class="c-backend export-box"/><text x="66" y="349" class="t-primary export-label"><tspan x="66" dy="0">The goal is</tspan><tspan x="66" dy="20">unchanged but</tspan><tspan x="66" dy="20">unrelated</tspan><tspan x="66" dy="20">material has</tspan><tspan x="66" dy="20">accumulated</tspan></text></g><g id="arch-d09-context-decision-en-node-handoff"><rect x="222" y="482" width="144" height="48" rx="9" class="c-external export-box"/><text x="234" y="505" class="t-primary export-label"><tspan x="234" dy="0">Hand off</tspan></text></g><g id="arch-d09-context-decision-en-node-transfer"><rect x="54" y="482" width="144" height="122" rx="9" class="c-backend export-box"/><text x="66" y="505" class="t-primary export-label"><tspan x="66" dy="0">An acceptance</tspan><tspan x="66" dy="20">boundary is</tspan><tspan x="66" dy="20">reached and a</tspan><tspan x="66" dy="20">new session will</tspan><tspan x="66" dy="20">take over</tspan></text></g><g id="arch-d09-context-decision-en-node-subtask"><rect x="222" y="638" width="144" height="48" rx="9" class="c-external export-box"/><text x="234" y="661" class="t-primary export-label"><tspan x="234" dy="0">Separate subtask</tspan></text></g><g id="arch-d09-context-decision-en-node-bounded"><rect x="54" y="638" width="144" height="102" rx="9" class="c-backend export-box"/><text x="66" y="661" class="t-primary export-label"><tspan x="66" dy="0">A side task has</tspan><tspan x="66" dy="20">its own</tspan><tspan x="66" dy="20">acceptance</tspan><tspan x="66" dy="20">criteria</tspan></text></g><g id="arch-d09-context-decision-en-node-compact"><rect x="222" y="774" width="144" height="48" rx="9" class="c-external export-box"/><text x="234" y="797" class="t-primary export-label"><tspan x="234" dy="0">Compress</tspan></text></g><g id="arch-d09-context-decision-en-node-long"><rect x="54" y="774" width="144" height="102" rx="9" class="c-backend export-box"/><text x="66" y="797" class="t-primary export-label"><tspan x="66" dy="0">The same task</tspan><tspan x="66" dy="20">must continue</tspan><tspan x="66" dy="20">but its history is</tspan><tspan x="66" dy="20">scattered</tspan></text></g></g><g><rect x="24" y="910" width="342" height="136" rx="8" class="export-note"/><text x="36" y="934" class="t-primary export-label"><tspan x="36" dy="0">Our decision table</tspan></text><text x="36" y="956" class="t-primary export-detail"><tspan x="36" dy="0">Our synthesis based on work needs, not a</tspan><tspan x="36" dy="20">reproduction of a source image.</tspan></text><text x="36" y="996" class="t-primary export-detail"><tspan x="36" dy="0">Preserve useful evidence and open questions</tspan><tspan x="36" dy="20">before cleaning up or compressing.</tspan></text></g></svg>
