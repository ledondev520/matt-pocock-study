<svg xmlns="http://www.w3.org/2000/svg" class="arch-d15-states-zh" role="img" aria-labelledby="arch-d15-states-zh-title arch-d15-states-zh-desc" viewBox="0 0 390 1072"><title id="arch-d15-states-zh-title">请求状态与合法转换</title><desc id="arch-d15-states-zh-desc">由 Archify 生成的生命周期图。</desc><style>.arch-d15-states-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d15-states-zh .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-d15-states-zh .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d15-states-zh .c-security { fill: var(--muted); stroke: var(--pink); }.arch-d15-states-zh .t-primary { fill: var(--foreground); }.arch-d15-states-zh .a-emphasis { stroke: var(--primary); fill: none; }.arch-d15-states-zh { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d15-states-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d15-states-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d15-states-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d15-states-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d15-states-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d15-states-zh .export-success .export-box { fill: var(--lime,#C6F432); }.arch-d15-states-zh .export-success text { fill: #241b35; }.arch-d15-states-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d15-states-zh .export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }.arch-d15-states-zh .export-dashed { stroke-dasharray: 6, 4; }.arch-d15-states-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d15-states-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d15-states-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d15-states-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d15-states-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">请求状态与合法转换</tspan></text><g aria-hidden="true"><path d="M195 120V164" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-zh-arrow)"/><path d="M195 212V256" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-zh-arrow)"/><path d="M336 188H360V372H336" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-zh-arrow)"/><path d="M54 372H29V188H54" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-zh-arrow)"/><path d="M54 280H14V96H54" class="a-emphasis export-edge" marker-end="url(#arch-d15-states-zh-arrow)"/><path d="M336 96H355V280H336" class="a-emphasis export-edge export-dashed" marker-end="url(#arch-d15-states-zh-arrow)"/></g><g><g id="arch-d15-states-zh-node-idle"><rect x="54" y="72" width="282" height="48" rx="9" class="c-frontend export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">idle</tspan></text></g><g id="arch-d15-states-zh-node-loading"><rect x="54" y="164" width="282" height="48" rx="9" class="c-frontend export-box"/><text x="66" y="187" class="t-primary export-label"><tspan x="66" dy="0">loading</tspan></text></g><g id="arch-d15-states-zh-node-success" class="export-success"><rect x="54" y="256" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="279" class="t-primary export-label"><tspan x="66" dy="0">success</tspan></text></g><g id="arch-d15-states-zh-node-error"><rect x="54" y="348" width="282" height="48" rx="9" class="c-security export-box export-wrong"/><text x="66" y="371" class="t-primary export-label"><tspan x="66" dy="0">error</tspan></text></g><text x="205" y="147" class="t-primary export-detail"><tspan x="205" dy="0">submit</tspan></text><text x="205" y="239" class="t-primary export-detail"><tspan x="205" dy="0">resolve</tspan></text></g><g><rect x="24" y="440" width="342" height="96" rx="8" class="export-note"/><text x="36" y="464" class="t-primary export-label"><tspan x="36" dy="0">表达方式</tspan></text><text x="36" y="486" class="t-primary export-detail"><tspan x="36" dy="0">可用 discriminated union、reducer 或状态机。</tspan></text><text x="36" y="506" class="t-primary export-detail"><tspan x="36" dy="0">简单场景保持简单。</tspan></text></g><g><rect x="24" y="554" width="342" height="96" rx="8" class="export-note"/><text x="36" y="578" class="t-primary export-label"><tspan x="36" dy="0">原创示例</tspan></text><text x="36" y="600" class="t-primary export-detail"><tspan x="36" dy="0">本站原创请求状态表；表外事件均不转换。</tspan></text><text x="36" y="620" class="t-primary export-detail"><tspan x="36" dy="0">success 才携带结果，error 才携带错误。</tspan></text></g><g><rect x="24" y="668" width="342" height="76" rx="8" class="export-note"/><text x="36" y="692" class="t-primary export-label"><tspan x="36" dy="0">loading → error</tspan></text><text x="36" y="714" class="t-primary export-detail"><tspan x="36" dy="0">reject</tspan></text></g><g><rect x="24" y="762" width="342" height="76" rx="8" class="export-note"/><text x="36" y="786" class="t-primary export-label"><tspan x="36" dy="0">error → loading</tspan></text><text x="36" y="808" class="t-primary export-detail"><tspan x="36" dy="0">retry</tspan></text></g><g><rect x="24" y="856" width="342" height="76" rx="8" class="export-note"/><text x="36" y="880" class="t-primary export-label"><tspan x="36" dy="0">success → idle</tspan></text><text x="36" y="902" class="t-primary export-detail"><tspan x="36" dy="0">reset</tspan></text></g><g><rect x="24" y="950" width="342" height="96" rx="8" class="export-note"/><text x="36" y="974" class="t-primary export-label"><tspan x="36" dy="0">idle → success</tspan></text><text x="36" y="996" class="t-primary export-detail"><tspan x="36" dy="0">× resolve：非法转换</tspan></text><text x="36" y="1016" class="t-primary export-detail"><tspan x="36" dy="0">忽略事件，保持 idle；测试须拦住提前成功。</tspan></text></g></svg>
