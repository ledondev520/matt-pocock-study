back-loop-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d07-feedback-loop-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d07-feedback-loop-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d07-feedback-loop-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Passing checks produce behavior</tspan><tspan x="24" dy="20">evidence</tspan></text><g aria-hidden="true"><path d="M195 140V184" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-en-arrow)"/><path d="M195 232V276" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-en-arrow)"/><path d="M195 324V368" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-en-arrow)"/><path d="M195 416V460" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-en-arrow)"/><path d="M195 560V604" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-en-arrow)"/><path d="M54 510H19V300H54" class="a-emphasis export-edge" marker-end="url(#arch-d07-feedback-loop-en-arrow)"/></g><g><g id="arch-d07-feedback-loop-en-node-ticket"><rect x="54" y="92" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="115" class="t-primary export-label"><tspan x="66" dy="0">Scoped ticket</tspan></text></g><g id="arch-d07-feedback-loop-en-node-expect"><rect x="54" y="184" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="207" class="t-primary export-label"><tspan x="66" dy="0">Reproduce / set expectations</tspan></text></g><g id="arch-d07-feedback-loop-en-node-implement"><rect x="54" y="276" width="282" height="48" rx="9" class="c-backend export-box"/><text 