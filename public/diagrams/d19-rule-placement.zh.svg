<svg xmlns="http://www.w3.org/2000/svg" class="arch-d19-rule-placement-zh" role="img" aria-labelledby="arch-d19-rule-placement-zh-title arch-d19-rule-placement-zh-desc" viewBox="0 0 390 550"><title id="arch-d19-rule-placement-zh-title">一条规则放在哪</title><desc id="arch-d19-rule-placement-zh-desc">按规则的作用选择位置。</desc><style>.arch-d19-rule-placement-zh { display: block; width: 100%; max-width: 390px; margin-inline: auto; height: auto; background: var(--background,#F8F7FC); color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d19-rule-placement-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d19-rule-placement-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d19-rule-placement-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d19-rule-placement-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d19-rule-placement-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d19-rule-placement-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d19-rule-placement-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d19-rule-placement-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d19-rule-placement-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">一条规则放在哪</tspan></text><g aria-hidden="true"/><g/><g><rect x="24" y="72" width="342" height="76" rx="8" class="export-note"/><text x="36" y="96" class="t-primary export-label"><tspan x="36" dy="0">导航</tspan></text><text x="36" y="118" class="t-primary export-detail"><tspan x="36" dy="0">放在哪: AGENTS.md</tspan></text></g><g><rect x="24" y="166" width="342" height="76" rx="8" class="export-