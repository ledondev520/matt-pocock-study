<svg xmlns="http://www.w3.org/2000/svg" class="arch-d10-what-stays-zh" role="img" aria-labelledby="arch-d10-what-stays-zh-title arch-d10-what-stays-zh-desc" viewBox="0 0 390 632"><title id="arch-d10-what-stays-zh-title">一条说明该放在哪里？</title><desc id="arch-d10-what-stays-zh-desc">由 Archify 生成的层级结构图。</desc><style>.arch-d10-what-stays-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d10-what-stays-zh .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-d10-what-stays-zh .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d10-what-stays-zh .c-external { fill: var(--muted); stroke: var(--primary); }.arch-d10-what-stays-zh .t-primary { fill: var(--foreground); }.arch-d10-what-stays-zh { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d10-what-stays-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d10-what-stays-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d10-what-stays-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d10-what-stays-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d10-what-stays-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d10-what-stays-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d10-what-stays-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }</style><defs><marker id="arch-d10-what-stays-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d10-what-stays-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" cl