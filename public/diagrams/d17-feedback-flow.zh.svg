<svg xmlns="http://www.w3.org/2000/svg" class="arch-d17-feedback-flow-zh" role="img" aria-labelledby="arch-d17-feedback-flow-zh-title arch-d17-feedback-flow-zh-desc" viewBox="0 0 390 1058"><title id="arch-d17-feedback-flow-zh-title">把反馈变成改进候选</title><desc id="arch-d17-feedback-flow-zh-desc">由 Archify 生成的工作流图。</desc><style>.arch-d17-feedback-flow-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d17-feedback-flow-zh .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d17-feedback-flow-zh .c-security { fill: var(--muted); stroke: var(--pink); }.arch-d17-feedback-flow-zh .t-primary { fill: var(--foreground); }.arch-d17-feedback-flow-zh .a-emphasis { stroke: var(--primary); fill: none; }.arch-d17-feedback-flow-zh { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d17-feedback-flow-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d17-feedback-flow-zh .export-title { font-size: 18px; font-weight: 700; }.arch-d17-feedback-flow-zh .export-label { font-size: 14px; font-weight: 650; }.arch-d17-feedback-flow-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d17-feedback-flow-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d17-feedback-flow-zh .export-success .export-box { fill: var(--lime,#C6F432); }.arch-d17-feedback-flow-zh .export-success text { fill: #241b35; }.arch-d17-feedback-flow-zh .export-decision { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d17-feedback-flow-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d17-feedback-flow-zh .export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }.arch-d17-feedback-flow-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-d17-feedback-flow-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d17-feedback-flow-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d17-feedback-flow-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d17-feedback-flow-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">把反馈变成改进候选</tspan></text><g aria-hidden="true"><path d="M195 120V164" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-zh-arrow)"/><path d="M195 212V256" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-zh-arrow)"/><path d="M195 304V348" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-zh-arrow)"/><path d="M195 448V492" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-zh-arrow)"/><path d="M336 398H350V608H336" class="a-emphasis export-edge" marker-end="url(#arch-d17-feedback-flow-zh-arrow)"/><path d="M336 96H355V700H336" class="a-emphasis export-edge export-wrong" marker-end="url(#arch-d17-feedback-flow-zh-wrong)"/></g><g><g id="arch-d17-feedback-flow-zh-node-feedback"><rect x="54" y="72" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">负面反馈</tspan></text></g><g id="arch-d17-feedback-flow-zh-node-respond"><rect x="54" y="164" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="187" class="t-primary export-label"><tspan x="66" dy="0">回应具体问题</tspan></text></g><g id="arch-d17-feedback-flow-zh-node-context"><rect x="54" y="256" width="282" height="48" rx="9" class="c-backend export-box"/><text x="66" y="279" class="t-