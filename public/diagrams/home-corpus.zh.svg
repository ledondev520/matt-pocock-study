<svg xmlns="http://www.w3.org/2000/svg" class="arch-home-corpus-zh" role="img" aria-labelledby="arch-home-corpus-zh-title arch-home-corpus-zh-desc" viewBox="0 0 390 738"><title id="arch-home-corpus-zh-title">语料库：索引通向原文</title><desc id="arch-home-corpus-zh-desc">由 Archify 生成的数据流图。</desc><style>.arch-home-corpus-zh { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-home-corpus-zh .c-frontend { fill: var(--muted); stroke: var(--primary); }.arch-home-corpus-zh .c-database { fill: var(--muted); stroke: var(--primary); }.arch-home-corpus-zh .c-external { fill: var(--muted); stroke: var(--primary); }.arch-home-corpus-zh .t-primary { fill: var(--foreground); }.arch-home-corpus-zh .a-emphasis { stroke: var(--primary); fill: none; }.arch-home-corpus-zh { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-home-corpus-zh text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-home-corpus-zh .export-title { font-size: 18px; font-weight: 700; }.arch-home-corpus-zh .export-label { font-size: 14px; font-weight: 650; }.arch-home-corpus-zh .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-home-corpus-zh .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-home-corpus-zh .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-home-corpus-zh .export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }.arch-home-corpus-zh .export-arrow { fill: var(--primary,#5129C5); }.arch-home-corpus-zh .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-home-corpus-zh .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }.arch-home-corpus-zh .export-note.export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }</style><defs><marker id="arch-home-corpus-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-home-corpus-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">语料库：索引通向原文</tspan></text><g aria-hidden="true"><path d="M195 154V198" class="a-emphasis export-edge" marker-end="url(#arch-home-corpus-zh-arrow)"/><path d="M195 280V324" class="a-emphasis export-edge" marker-end="url(#arch-home-corpus-zh-arrow)"/><path d="M195 386V430" class="a-emphasis export-edge" marker-end="url(#arch-home-corpus-zh-arrow)"/></g><g><g id="arch-home-corpus-zh-node-public"><rect x="54" y="72" width="282" height="82" rx="9" class="c-external export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">公开内容</tspan></text><text x="66" y="115" class="t-primary export-detail"><tspan x="66" dy="0">X / X Article</tspan><tspan x="66" dy="20">aihero.dev / GitHub</tspan></text></g><g id="arch-home-corpus-zh-node-record"><rect x="54" y="198" width="282" height="82" rx="9" class="c-database export-box"/><text x="66" y="221" class="t-primary export-label"><tspan x="66" dy="0">一条记录</tspan></text><text x="66" y="241" class="t-primary export-detail"><tspan x="66" dy="0">链接 · 日期 · 类型</tspan><tspan x="66" dy="20">主题 · 互动 · 双语摘要</tspan></text></g><g id="arch-home-corpus-zh-node-search"><rect x="54" y="324" width="282" height="62" rx="9" class="c-frontend export-box"/><text x="66" y="347" class="t-primary export-label"><tspan x="66" dy="0">语料页</tspan></text><text x="66" y="367" class="t-primary export-detail"><tspan x="66" dy="0">关键词 · 筛选 · 排序</tspan></text></g><g id="arch-home-corpus-zh-node-original"><rect x="54" y="430" width="282" height="48" rx="9" class="c-external export-box"/><text x="66" y="453" class="t-primary export-label"><tspan x="66" dy="0">原文</tspan></text></g><text x="205" y="181" class="t-primary export-detail"><tspan x="205" dy="0">仅索引</tspan></text><text x="205" y="307" class="t-primary export-detail"><tspan x="205" dy="0">自写摘要</tspan></text><text x="205" y="413" class="t-primary export-detail"><tspan x="205" dy="0">直达原文</tspan></text></g><g><rect x="24" y="522" width="342" height="76" rx="8" class="export-note export-wrong"/><text x="36" y="546" class="t-primary export-label"><tspan x="36" dy="0">× 不收全文</tspan></text><text x="36" y="568" class="t-primary export-detail"><tspan x="36" dy="0">不收原文全文、评论原文和 Article 全文。</tspan></text></g><g><rect x="24" y="616" width="342" height="96" rx="8" class="export-note"/><text x="36" y="640" class="t-primary export-label"><tspan x="36" dy="0">检索方式</tspan></text><text x="36" y="662" class="t-primary export-detail"><tspan x="36" dy="0">按类型、主题标签、日期筛选；按互动数或日期排</tspan><tspan x="36" dy="20">序。</tspan></text></g></svg>
