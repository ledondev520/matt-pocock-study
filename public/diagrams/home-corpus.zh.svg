-note { fill: var(--card-accent,#F8F7FC); stroke: var(--border,#DCD6E7); }.arch-home-corpus-zh .export-note.export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }</style><defs><marker id="arch-home-corpus-zh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-home-corpus-zh-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">语料库：索引通向原文</tspan></text><g aria-hidden="true"><path d="M195 154V198" class="a-emphasis export-edge" marker-end="url(#arch-home-corpus-zh-arrow)"/><path d="M195 280V324" class="a-emphasis export-edge" marker-end="url(#arch-home-corpus-zh-arrow)"/><path d="M195 386V430" class="a-emphasis export-edge" marker-end="url(#arch-home-corpus-zh-arrow)"/></g><g><g id="arch-home-corpus-zh-node-public" data-node="public"><rect x="54" y="72" width="282" height="82" rx="9" class="c-external export-box"/><text x="66" y="95" class="t-primary export-label"><tspan x="66" dy="0">公开内容</tspan></text><text x="66" y="115" class="t-primary export-detail"><tspan x="66" dy="0">X / X Article</tspan><tspan x="66" dy="20">aihero.dev / GitHub</tspan></text></g><g id="arch-home-corpus-zh-node-record" data-node="record"><rect x="54" y="198" width="282" height="82" rx="9" class="c-database export-box"/><text x="66" y="221" class="t-primary export-label"><tspan x="66" dy="0">一条记录</tspan></text><text x="66" y="241" class="t-primary export-detail"><tspan x="66" dy="0">链接 · 日期 · 类型</tspan><tspan x="66" dy="20">主题 · 互动 · 双语摘要</tspan></text></g><g id="arch-home-corpus-zh-node-search" data-node="search"><rect x="54" y="324" width="282" height="62" rx="9" class="c-frontend export-box"/><text x="66" y="347" class="t-primary export-label"><tspan x="66" dy="0">语料页</tspan></text><text x="66" 