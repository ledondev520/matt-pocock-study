n .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d02-failure-sort-en .export-note { fill: var(--card-accent,#F8F7FC); stroke: var(--border,#DCD6E7); }.arch-d02-failure-sort-en .export-note.export-wrong { stroke: var(--pink,#F25CAC); stroke-dasharray: 5, 4; }</style><defs><marker id="arch-d02-failure-sort-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d02-failure-sort-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Locate the failure, improve the</tspan><tspan x="24" dy="20">environment</tspan></text><g aria-hidden="true"><path d="M36 116H24V202H54" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/><path d="M198 202H210V209H222" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/><path d="M36 116H24V298H54" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/><path d="M198 298H210V305H222" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/><path d="M36 116H24V394H54" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/><path d="M198 394H210V401H222" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/><path d="M36 116H24V490H54" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/><path d="M198 490H210V497H222" class="a-emphasis export-edge" marker-end="url(#arch-d02-failure-sort-en-arrow)"/></g><g><g id="arch-d02-failure-sort-en-node-root" data-node="root"><rect x="36" y="92" width="330" height="48" rx="9" class="c-frontend export-box"/><text x="48" y="115" class="t-primary export-label"><tspan x="48" dy="0">The agent failed</tspan></text></g><a href="/en