<svg xmlns="http://www.w3.org/2000/svg" class="arch-d14-tool-picker-en" role="img" aria-labelledby="arch-d14-tool-picker-en-title arch-d14-tool-picker-en-desc" viewBox="0 0 390 562"><title id="arch-d14-tool-picker-en-title">Choose type tools by problem</title><desc id="arch-d14-tool-picker-en-desc">Each tool addresses one problem and has limits.</desc><style>.arch-d14-tool-picker-en { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d14-tool-picker-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d14-tool-picker-en .export-title { font-size: 18px; font-weight: 700; }.arch-d14-tool-picker-en .export-label { font-size: 14px; font-weight: 650; }.arch-d14-tool-picker-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d14-tool-picker-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d14-tool-picker-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d14-tool-picker-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d14-tool-picker-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker><marker id="arch-d14-tool-picker-en-wrong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-wrong-arrow"/></marker></defs><text x="24" y="30" class="t-primary export-title"><tspan x="24" dy="0">Choose type tools by problem</tspan></text><g aria-hidden="true"/><g/><g><rect x="24" y="72" width="342" height="156" rx="8" class="export-note"/><text x="36" y="96" class="t-primary export-label"><tspan x="36" dy="0">Mixed string IDs</tspan></text><text x="36" y="118" class="t-primary export-detail"><tspan x="36" dy="0">Tool: branded types</tspan></text><text x="36" y="138" class="t-primary export-detail"><tspan x="36" dy="0">What it does: Distinguish domain values</tspan><tspan x="36" dy="20">statically</tspan></text><text x="36" y="178" class="t-primary export-detail"><tspan x="36" dy="0">What it leaves open: Does not validate network</tspan><tspan x="36" dy="20">input</tspan></text></g><g><rect x="24" y="246" width="342" height="136" rx="8" class="export-note"/><text x="36" y="270" class="t-primary export-label"><tspan x="36" dy="0">Widened literals</tspan></text><text x="36" y="292" class="t-primary export-detail"><tspan x="36" dy="0">Tool: `as const`</tspan></text><text x="36" y="312" class="t-primary export-detail"><tspan x="36" dy="0">What it does: Preserve literal information</tspan></text><text x="36" y="332" class="t-primary export-detail"><tspan x="36" dy="0">What it leaves open: readonly ≠ runtime</tspan><tspan x="36" dy="20">freezing</tspan></text></g><g><rect x="24" y="400" width="342" height="136" rx="8" class="export-note"/><text x="36" y="424" class="t-primary export-label"><tspan x="36" dy="0">Incomplete key handling</tspan></text><text x="36" y="446" class="t-primary export-detail"><tspan x="36" dy="0">Tool: `PropertyKey`</tspan></text><text x="36" y="466" class="t-primary export-detail"><tspan x="36" dy="0">What it does: Covers string, number, symbol</tspan></text><text x="36" y="486" class="t-primary export-detail"><tspan x="36" dy="0">What it leaves open: Type expressiveness ≠</tspan><tspan x="36" dy="20">runtime support</tspan></text></g></svg>
