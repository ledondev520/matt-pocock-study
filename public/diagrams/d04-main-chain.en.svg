<svg xmlns="http://www.w3.org/2000/svg" class="arch-d04-main-chain-en" role="img" aria-labelledby="arch-d04-main-chain-en-title arch-d04-main-chain-en-desc" viewBox="0 0 390 1330"><title id="arch-d04-main-chain-en-title">From alignment to a reviewable PR</title><desc id="arch-d04-main-chain-en-desc">A workflow diagram generated by Archify.</desc><style>.arch-d04-main-chain-en { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace; }.arch-d04-main-chain-en .c-backend { fill: var(--muted); stroke: var(--primary); }.arch-d04-main-chain-en .t-primary { fill: var(--foreground); }.arch-d04-main-chain-en .a-emphasis { stroke: var(--primary); fill: none; }.arch-d04-main-chain-en { display: block; color: var(--foreground,#241B35); font-family: system-ui, sans-serif; }.arch-d04-main-chain-en text { fill: var(--foreground,#241B35); font-size: 14px; }.arch-d04-main-chain-en .export-title { font-size: 18px; font-weight: 700; }.arch-d04-main-chain-en .export-label { font-size: 14px; font-weight: 650; }.arch-d04-main-chain-en .export-detail { font-size: 14px; fill: var(--muted-foreground,#6B607B); }.arch-d04-main-chain-en .export-box { fill: var(--card,#FFFFFF); stroke: var(--primary,#5129C5); stroke-width: 1.5; }.arch-d04-main-chain-en .export-edge { fill: none; stroke: var(--primary,#5129C5); stroke-width: 1.5; stroke-linejoin: round; }.arch-d04-main-chain-en .export-dashed { stroke-dasharray: 6, 4; }.arch-d04-main-chain-en .export-arrow { fill: var(--primary,#5129C5); }.arch-d04-main-chain-en .export-wrong-arrow { fill: var(--pink,#F25CAC); }.arch-d04-main-chain-en .export-note { fill: var(--card,#FFFFFF); stroke: var(--border,#DCD6E7); }</style><defs><marker id="arch-d04-main-chain-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" class="export-arrow"/></marker