ket</tspan></text><text x="66" y="387" class="t-primary export-detail"><tspan x="66" dy="0">In: spec</tspan><tspan x="66" dy="20">Out: independently verifiable vertical</tspan><tspan x="66" dy="20">slice</tspan></text></g><g id="arch-d04-main-chain-en-node-implement"><rect x="54" y="490" width="282" height="82" rx="9" class="c-backend export-box"/><text x="66" y="513" class="t-primary export-label"><tspan x="66" dy="0">Implement</tspan></text><text x="66" y="533" class="t-primary export-detail"><tspan x="66" dy="0">In: bounded ticket</tspan><tspan x="66" dy="20">Out: change passing relevant checks</tspan></text></g><g id="arch-d04-main-chain-en-node-review"><rect x="54" y="616" width="282" height="102" rx="9" class="c-backend export-box"/><text x="66" y="639" class="t-primary export-label"><tspan x="66" dy="0">Review</tspan></text><text x="66" y="659" class="t-primary export-detail"><tspan x="66" dy="0">In: change + references</tspan><tspan x="66" dy="20">Out: requirements + standards</tspan><tspan x="66" dy="20">conclusions</tspan></text></g><g id="arch-d04-main-chain-en-node-pr"><rect x="54" y="762" width="282" height="102" rx="9" class="c-backend export-box"/><text x="66" y="785" class="t-primary export-label"><tspan x="66" dy="0">PR</tspan></text><text x="66" y="805" class="t-primary export-detail"><tspan x="66" dy="0">In: review + behavior evidence</tspan><tspan x="66" dy="20">Out: overview, before/after evidence,</tspan><tspan x="66" dy="20">merge risk</tspan></text></g><g id="arch-d04-main-chain-en-node-wayfinder"><rect x="54" y="908" width="282" height="82" rx="9" class="c-backend export-box"/><text x="66" y="931" class="t-primary export-label"><tspan x="66" dy="0">/wayfinder</tspan></text><text x="66" y="951" class="t-primary export-detail"><tspan x="66" dy="0">Map index · dependencies · open</tspan><tspan x="66" dy="20">questions</tspan></text></g></g><g><rect x="24" y="1034" width="342" height="176" rx="8" class="export-note"/><text x="36" y="1058" class="t-primary export-label"><tspan x="36" dy="0">Different ticket roles</tspan></text><text x="36" y="1080" class="t-primary export-detail"><tspan x="36" dy="0">Decision tickets ≠ implementation tickets;</tspan><tspan x="36" dy="20">commands are entry points.</tspan></text><text x="36" y="1120" class="t-primary export-detail"><tspan x="36" dy="0">Spec: goals, behavior, exclusions and</tspan><tspan x="36" dy="20">acceptance.</tspan></text><text x="36" y="1160" class="t-primary export-detail"><tspan x="36" dy="0">PR: overview, before/after evidence and merge</tspan><tspan x="36" dy="20">risk.</tspan></text></g><g><rect x="24" y="1228" width="342" height="76" rx="8" class="export-note"/><text x="36" y="1252" class="t-primary export-label"><tspan x="36" dy="0">/wayfinder → Specify</tspan></text><text x="36" y="1274" class="t-primary export-detail"><tspan x="36" dy="0">Cross-session decisions</tspan></text></g></svg>
