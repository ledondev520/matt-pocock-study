  <g id="text">
    <text x="68" y="64.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg">缺配置 → 显示成功</text>
    <text x="42" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">01</text>
    <text x="42" y="209.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block">复现假成功</text>
    <text x="42" y="272" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">这一层要做</text>
    <text x="42" y="304" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="42" dy="0">缺地址仍</tspan><tspan x="42" dy="21.6">显示已发送</tspan></text>
    <text x="238" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">02</text>
    <text x="238" y="209.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block">拒绝无效配置</text>
    <text x="238" y="272" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">这一层要做</text>
    <text x="238" y="304" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="238" dy="0">停止发送,</tspan><tspan x="238" dy="21.6">界面显示失败</tspan></text>
    <text x="434" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">03</text>
    <text x="434" y="209.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block">检查两种路径</text>
    <text x="434" y="272" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">这一层要做</text>
    <text x="434" y="304" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="434" dy="0">缺配置报错,</tspan><tspan x="434" dy="21.6">有效配置能发</tspan></text>
    <text x="630" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">04</text>
    <text x="630" y="209.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block">评审证据</text>
    <text x="630" y="272" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">这一层要做</text>
    <text x="630" y="304" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="630" dy="0">两种配置的</tspan><tspan x="630" dy="21.6">操作、日志、界面</tspan></text>
    <text x="50" y="435.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#1A2110" class="f-on-lime">完成标准</text>
    <text x="160" y="435.6" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#1A2110" class="f-on-lime">能指出是哪一层阻止了同类错误</text>
  </g>
</svg>