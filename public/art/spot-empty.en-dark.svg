<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="spot-empty-title spot-empty-desc">
  <title id="spot-empty-title">When nothing matches: how to widen the search</title>
  <desc id="spot-empty-desc">Empty results: no matching records. Next: try other keywords, remove type or tag filters, widen the date range.</desc>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#0E0A1F" class="f-bg"/>
    <rect x="100" y="32" width="600" height="248" rx="18" fill="#171128" stroke="#352A48" stroke-width="2" stroke-dasharray="8 6" class="f-card s-border"/>
    <circle cx="388" cy="114" r="30" fill="none" stroke="#352A48" stroke-width="6" class="s-border"/>
    <path d="M410 136 L432 158" fill="none" stroke="#352A48" stroke-width="8" class="s-border" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M378 104 L398 124 M398 104 L378 124" fill="none" stroke="#F25CAC" stroke-width="4" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M400 284 L400 300 L168 300 L168 330" fill="none" stroke="#AEA4C0" stroke-width="2" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164.5 322.8 L168 330 L171.5 322.8" fill="none" stroke="#AEA4C0" stroke-width="2" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="336" width="208" height="92" rx="14" fill="#171128" stroke="#A083F4" stroke-width="2" class="f-card s-accent"/>
    <path d="M400 284 L400 330" fill="none" stroke="#AEA4C0" stroke-width="2" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M396.5 322.8 L400 330 L403.5 322.8" fill="none" stroke="#AEA4C0" stroke-width="2" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="296" y="336" width="208" height="92" rx="14" fill="#171128" stroke="#A083F4" stroke-width="2" class="f-card s-accent"/>
    <path d="M400 284 L400 300 L632 300 L632 330" fill="none" stroke="#AEA4C0" stroke-width="2" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M628.5 322.8 L632 330 L635.5 322.8" fill="none" stroke="#AEA4C0" stroke-width="2" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="528" y="336" width="208" height="92" rx="14" fill="#171128" stroke="#A083F4" stroke-width="2" class="f-card s-accent"/>
  </g>
  <g id="text">
    <text x="400" y="214" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#EAE5F4" class="f-fg" text-anchor="middle">No matching records</text>
    <text x="400" y="246" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#AEA4C0" class="f-fg2" text-anchor="middle">Try one of these</text>
    <text x="168" y="387.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#A083F4" class="f-accent" text-anchor="middle">Try other keywords</text>
    <text x="400" y="376.4" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#A083F4" class="f-accent" text-anchor="middle"><tspan x="400" dy="0">Remove type</tspan><tspan x="400" dy="23.0">or tag filters</tspan></text>
    <text x="632" y="376.4" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#A083F4" class="f-accent" text-anchor="middle"><tspan x="632" dy="0">Widen the</tspan><tspan x="632" dy="23.0">date range</tspan></text>
    <text x="400" y="470" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2" text-anchor="middle">Adjust the criteria, then search again</text>
  </g>
</svg>