    <text x="456" y="70.3" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#EAE5F4" class="f-fg">Define the goal first</text>
    <text x="202" y="134.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">“Search results are awkward”</text>
    <text x="598" y="134.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">“Search results are awkward”</text>
    <text x="122.0" y="219.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg" text-anchor="middle">Highlighting</text>
    <text x="282.0" y="219.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg" text-anchor="middle">Filters</text>
    <text x="122.0" y="273.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg" text-anchor="middle">Sorting</text>
    <text x="282.0" y="273.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg" text-anchor="middle">Layout</text>
    <text x="68" y="360.1" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="68" dy="0">A guess turns into code,</tspan><tspan x="68" dy="20.2">tests and rework</tspan></text>
    <text x="48" y="448" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#AEA4C0" class="f-fg2">Each change solves a different problem</text>
    <text x="462" y="196.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">1</text>
    <text x="500" y="187.5" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="500" dy="0">Who is searching,</tspan><tspan x="500" dy="18.9">for what?</tspan></text>
    <text x="462" y="252.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">2</text>
    <text x="500" y="252.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAE5F4" class="f-fg">Where do they get stuck?</text>
    <text x="462" y="308.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">3</text>
    <text x="500" y="299.4" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="500" dy="0">What would count as</tspan><tspan x="500" dy="18.9">an improvement?</tspan></text>
    <text x="464" y="402.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#EAE5F4" class="f-fg">Then compare solutions</text>
    <text x="444" y="448" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#AEA4C0" class="f-fg2">The goal decides what to compare</text>
