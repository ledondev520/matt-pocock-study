<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s05-vague-to-goal-title s05-vague-to-goal-desc" class="svg-0c9db90d-09c4-4bbf-b4f6-81c8732134b6">
  <title id="s05-vague-to-goal-title">Define the goal before comparing solutions</title>
  <desc id="s05-vague-to-goal-desc">Left: someone finds the search results awkward; implementing highlighting, filters, sorting or a new layout right away turns a guess into code, tests and rework. Right: first establish who is searching for what, where they get stuck and what would count as an improvement, then compare solutions.</desc>
