<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s06-ticket-anatomy-title s06-ticket-anatomy-desc">
  <title id="s06-ticket-anatomy-title">一张合格的纵向工单</title>
  <desc id="s06-ticket-anatomy-desc">收藏工单六栏:任务、依赖、范围外、失败时观察到、成功时观察到、验收证据;刷新后状态与存储一致。</desc>
  <defs><clipPath id="s06-ticket-anatomy-clip1"><rect x="40" y="32" width="476" height="436" rx="16"/></clipPath></defs>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#F8F7FC" class="f-bg"/>
    <rect x="40" y="32" width="476" height="436" rx="16" fill="#FFFFFF" class="f-card"/>
    <rect x="40" y="32" width="476" height="64" clip-path="url(#s06-ticket-anatomy-clip1)" fill="#43209E" class="f-violet"/>
    <rect x="40" y="32" width="476" height="436" rx="16" fill="none" stroke="#DCD6E7" stroke-width="1.5" class="s-border"/>
    <rect x="56" y="108" width="444" height="54" rx="10" fill="#F8F7FC" stroke="#DCD6E7" stroke-width="1" class="f-inner s-border"/>
    <rect x="56" y="166" width="444" height="54" rx="10" fill="#F8F7FC" stroke="#DCD6E7" stroke-width="1" class="f-inner s-border"/>
    <rect x="56" y="224" width="444" height="54" rx="10" fill="#F8F7FC" stroke="#DCD6E7" stroke-width="1" class="f-inner s-border"/>
    <rect x="56" y="282" width="444" height="54" rx="10" fill="#F8F7FC" stroke="#DCD6E7" stroke-width="1" class="f-inner s-border"/>
    <rect x="56" y="340" width="444" height="54" rx="10" fill="#F8F7FC" stroke="#DCD6E7" stroke-width="1" class="f-inner s-border"/>
    <rect x="56" y="398" width="444" height="54" rx="10" fill="#C6F432" class="f-lime"/>
    <rect x="556" y="132" width="204" height="236" rx="16" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="578" y="217" width="30" height="30" rx="7" fill="#5129C5" class="f-block"/>
    <path d="M586 232 L590.7 236.9 L600 226.4" fill="none" stroke="#FFFFFF" stroke-width="3" class="s-on-block" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="578" y="295" width="30" height="30" rx="7" fill="#5129C5" class="f-block"/>
    <path d="M586 310 L590.7 314.9 L600 304.4" fill="none" stroke="#FFFFFF" stroke-width="3" class="s-on-block" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M518 250 L552 250" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M543.9 253.9 L552 250 L543.9 246.1" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="text">
    <text x="64" y="71.0" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" class="f-on-block">纵向工单</text>
    <text x="492" y="69.6" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#E4DAFB" class="f-on-block2" text-anchor="end">示例</text>
    <text x="72" y="139.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241B35" class="f-fg">任务</text>
    <text x="224" y="130.4" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2"><tspan x="224" dy="0">点击收藏并保存</tspan><tspan x="224" dy="18.9">刷新后仍已收藏</tspan></text>
    <text x="72" y="197.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241B35" class="f-fg">依赖</text>
    <text x="224" y="188.5" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2"><tspan x="224" dy="0">内容 ID、现有用户身份</tspan><tspan x="224" dy="18.9">可用的存储接口</tspan></text>
    <text x="72" y="255.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241B35" class="f-fg">范围外</text>
    <text x="224" y="255.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2">批量、筛选、多端同步</text>
    <text x="72" y="313.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241B35" class="f-fg">失败时观察到</text>
    <text x="224" y="304.4" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2"><tspan x="224" dy="0">保存失败有提示</tspan><tspan x="224" dy="18.9">不假成功,允许重试</tspan></text>
    <text x="72" y="371.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241B35" class="f-fg">成功时观察到</text>
    <text x="224" y="362.4" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2"><tspan x="224" dy="0">点击、保存、刷新后</tspan><tspan x="224" dy="18.9">状态与存储一致</tspan></text>
    <text x="72" y="429.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1A2110" class="f-on-lime">验收证据</text>
    <text x="224" y="420.4" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#1A2110" class="f-on-lime"><tspan x="224" dy="0">一次成功操作</tspan><tspan x="224" dy="18.9">一次模拟保存失败</tspan></text>
    <text x="578" y="172" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#241B35" class="f-fg">合格标准</text>
    <text x="622" y="237.6" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg">能独立验收</text>
    <text x="622" y="315.6" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg">依赖明确</text>
  </g>
</svg>