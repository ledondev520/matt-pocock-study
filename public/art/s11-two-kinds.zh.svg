<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s11-two-kinds-title s11-two-kinds-desc">
  <title id="s11-two-kinds-title">规则先分两类</title>
  <desc id="s11-two-kinds-desc">可机械检查的事实交给 lint、hook、类型或 CI,错误输出要告诉 agent 如何修复;需要上下文判断的取舍留给评审并附理由。</desc>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#F8F7FC" class="f-bg"/>
    <rect x="300" y="24" width="200" height="52" rx="26" fill="#43209E" class="f-violet"/>
    <path d="M400 76 V100" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M206 124 Q206 100 230 100 H570 Q594 100 594 124" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M206 124 L206 136" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M203.0 129.7 L206 136 L209.0 129.7" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="140" width="364" height="80" rx="14" fill="#5129C5" class="f-block"/>
    <path d="M206 224 L206 254" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M202.1 245.9 L206 254 L209.9 245.9" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="258" width="364" height="92" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="24" y="366" width="364" height="80" rx="14" fill="#C6F432" class="f-lime"/>
    <path d="M594 124 L594 136" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M591.0 129.7 L594 136 L597.0 129.7" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="412" y="140" width="364" height="80" rx="14" fill="#7445EB" class="f-accent"/>
    <path d="M594 224 L594 254" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M590.1 245.9 L594 254 L597.9 245.9" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="412" y="258" width="364" height="92" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="412" y="366" width="364" height="80" rx="14" fill="#EEEBF5" class="f-muted"/>
  </g>
  <g id="text">
    <text x="400.0" y="56.3" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">一条规则</text>
    <text x="206.0" y="186.3" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">可机械检查的事实</text>
    <text x="206.0" y="298.4" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle"><tspan x="206.0" dy="0">lint、hook、</tspan><tspan x="206.0" dy="23.0">类型或 CI 执行</tspan></text>
    <text x="48" y="401.1" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#1A2110" class="f-on-lime"><tspan x="48" dy="0">错误输出要告诉 agent</tspan><tspan x="48" dy="20.2">如何修复</tspan></text>
    <text x="594.0" y="186.3" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">需要上下文判断的取舍</text>
    <text x="594.0" y="298.4" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle"><tspan x="594.0" dy="0">留给评审,</tspan><tspan x="594.0" dy="23.0">并附理由</tspan></text>
    <text x="436" y="401.1" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg"><tspan x="436" dy="0">评审写明依据,</tspan><tspan x="436" dy="20.2">而不是只给结论</tspan></text>
    <text x="400" y="476" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2" text-anchor="middle">示例:「导入方向」可机械检查;「命名是否清楚」要判断</text>
  </g>
</svg>