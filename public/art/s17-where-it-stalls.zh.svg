<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s17-where-it-stalls-title s17-where-it-stalls-desc" class="svg-b1b89afb-fd51-4810-8e08-04a6d24bf752">
  <title id="s17-where-it-stalls-title">收到批评或好方法时，讨论卡在哪里</title>
  <desc id="s17-where-it-stalls-desc">两种情境：有人说规则没用，卡住的反应是先解释自己没错，继续学习的做法是先问哪一步没有产生预期结果；有人分享好方法，卡住的做法是转述时只剩自己的名字，继续学习的做法是保留作者与原始链接。</desc>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#F8F7FC" class="f-bg"/>
    <rect x="24" y="78" width="752" height="150" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="40" y="122" width="200" height="62" rx="14" fill="#5B3FB8" class="f-block"/>
    <path d="M244 153 L270 153" fill="none" stroke="#6B607B" stroke-width="1.5" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
