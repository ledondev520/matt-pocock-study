    <rect x="132" y="40" width="210" height="160" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <path d="M228.0 79 L246.0 97 M246.0 79 L228.0 97" fill="none" stroke="#F25CAC" stroke-width="3.5" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="352" y="40" width="210" height="160" rx="14" fill="#5129C5" class="f-block"/>
    <circle cx="457.0" cy="92" r="20" fill="#FFFFFF" class="f-on-block"/>
    <path d="M449.0 92 L454.3 97.6 L465.0 85.6" fill="none" stroke="#5129C5" stroke-width="3" class="s-block" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="210" width="210" height="160" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
