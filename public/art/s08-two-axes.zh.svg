    <rect x="352" y="210" width="210" height="160" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <path d="M448.0 249 L466.0 267 M466.0 249 L448.0 267" fill="none" stroke="#F25CAC" stroke-width="3.5" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 388 L562 388" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M553.9 391.9 L562 388 L553.9 384.1" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M114 370 L114 40" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M117.9 48.1 L114 40 L110.1 48.1" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="594" y="140" width="141" height="40" rx="20" fill="#FCE7F2" stroke="#F25CAC" stroke-width="1.5" stroke-dasharray="5 4" class="f-pink-tint s-pink"/>
    <path d="M610 154 L622 166 M622 154 L610 166" fill="none" stroke="#F25CAC" stroke-width="3" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="text">
    <text x="237.0" y="142.8" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle"><tspan x="237.0" dy="0">规范对</tspan><tspan x="237.0" dy="21.6">需求错</tspan></text>
    <text x="457.0" y="158.7" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">都通过</text>
    <text x="237.0" y="323.6" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">都没过</text>
    <text x="457.0" y="312.8" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle"><tspan x="457.0" dy="0">需求对</tspan><tspan x="457.0" dy="21.6">违反约定</tspan></text>
    <text x="347" y="418" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">需求是否实现 →</text>
    <text x="136" y="418" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2">否</text>
    <text x="558" y="418" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2" text-anchor="end">是</text>
    <text x="100" y="205" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle" transform="rotate(-90 100 205)">是否遵守仓库规范 →</text>
    <text x="106" y="364" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2" text-anchor="end">否</text>
    <text x="106" y="56" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2" text-anchor="end">是</text>
    <text x="634" y="165.6" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg">总分 7/10</text>
    <path class="strike s-pink" d="M631.0 160.5 H707.1" stroke="#F25CAC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="594" y="244.8" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#241B35" class="f-fg"><tspan x="594" dy="0">单一总分会</tspan><tspan x="594" dy="21.6">掩盖另一条轴</tspan></text>
  </g>
</svg>