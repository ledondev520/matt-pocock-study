    <text x="48" y="256.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#EAE5F4" class="f-fg">输出</text>
    <text x="432" y="62" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#EAE5F4" class="f-fg">tracer bullet</text>
    <text x="432" y="88" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">先跑通一条细线</text>
    <text x="432" y="140.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#EAE5F4" class="f-fg">输入</text>
    <text x="432" y="198.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#EAE5F4" class="f-fg">处理</text>
    <text x="432" y="256.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#EAE5F4" class="f-fg">输出</text>
    <text x="94" y="343.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#EAE5F4" class="f-fg">最后才发现接不上</text>
    <text x="72" y="389.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#EAE5F4" class="f-fg">集成风险全部留到最后</text>
    <text x="478" y="343.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#EAE5F4" class="f-fg">先验证端到端路径</text>
    <text x="456" y="389.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#EAE5F4" class="f-fg">再从细线向两侧加粗</text>
    <text x="400" y="474" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2" text-anchor="middle">tracer bullet 并非 Matt 原创术语</text>
  </g>
