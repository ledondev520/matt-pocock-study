<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s06-tracer-title s06-tracer-desc">
  <title id="s06-tracer-title">先打通一条 tracer bullet</title>
  <desc id="s06-tracer-desc">左:输入、处理、输出各层分别做完,最后才发现接不上。右:一根细线先贯穿三层,验证端到端路径,再向两侧加粗。</desc>
