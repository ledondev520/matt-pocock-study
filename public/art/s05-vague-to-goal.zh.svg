    <text x="462" y="196.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">1</text>
