  <title id="s05-vague-to-goal-title">「不好用」先问清目标，再比较方案</title>
  <desc id="s05-vague-to-goal-desc">左：用户说搜索结果不好用，直接实现高亮、筛选、排序或布局，猜测变成代码、测试和返工。右：先问谁在什么场景下找什么、现在卡在哪里、什么变化能说明问题缓解，再比较方案。</desc>
