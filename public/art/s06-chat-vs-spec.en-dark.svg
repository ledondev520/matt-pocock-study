  <title id="s06-chat-vs-spec-title">Decision only in chat vs written into the spec</title>
  <desc id="s06-chat-vs-spec-desc">Left: the decision to preserve form input after a failed save stays in yesterday's chat, so a fresh session clears the form. Right: the same decision sits in the spec's Behaviour row, where a new session can find it.</desc>
