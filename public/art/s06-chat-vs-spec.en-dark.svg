    <text x="472" y="226.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#EAE5F4" class="f-fg">Behaviour</text>
    <text x="568" y="226.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#EAE5F4" class="f-fg">Keep input if save fails</text>
