<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s16-lesson-order-title s16-lesson-order-desc">
  <title id="s16-lesson-order-title">Four steps of an explanation</title>
  <desc id="s16-lesson-order-desc">Problem → cause → method → example. The first line names a specific difficulty or goal; one concept, one small scenario.</desc>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#F8F7FC" class="f-bg"/>
    <rect x="40" y="372" width="172" height="96" rx="12" fill="#43209E" class="f-violet"/>
    <rect x="222" y="302" width="172" height="166" rx="12" fill="#5129C5" class="f-block"/>
    <rect x="404" y="232" width="172" height="236" rx="12" fill="#7445EB" class="f-accent"/>
    <rect x="586" y="162" width="172" height="306" rx="12" fill="#C6F432" class="f-lime"/>
    <rect x="40" y="200" width="340" height="84" rx="12" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <path d="M110 286 L110 366" fill="none" stroke="#6B607B" stroke-width="1.5" stroke-dasharray="3 4" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="420" y="40" width="340" height="64" rx="12" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <path d="M672 106 L672 156" fill="none" stroke="#6B607B" stroke-width="1.5" stroke-dasharray="3 4" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="text">
    <text x="60" y="404" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#FFFFFF" class="f-on-block">01</text>
    <text x="60" y="438" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" class="f-on-block">Problem</text>
    <text x="242" y="334" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#FFFFFF" class="f-on-block">02</text>
    <text x="242" y="368" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" class="f-on-block">Cause</text>
    <text x="424" y="264" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#FFFFFF" class="f-on-block">03</text>
    <text x="424" y="298" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" class="f-on-block">Method</text>
    <text x="606" y="194" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#1A2110" class="f-on-lime">04</text>
    <text x="606" y="228" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1A2110" class="f-on-lime">Example</text>
    <text x="60" y="237.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg"><tspan x="60" dy="0">First line: a specific</tspan><tspan x="60" dy="20.2">difficulty or goal</tspan></text>
    <text x="440" y="77.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg">One concept, one small scenario</text>
  </g>
</svg>