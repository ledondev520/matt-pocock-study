<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s17-where-it-stalls-title s17-where-it-stalls-desc" class="svg-f0071b34-3839-4ec2-b1fa-19c9549db18a">
  <title id="s17-where-it-stalls-title">Where criticism and shared methods can stall</title>
  <desc id="s17-where-it-stalls-desc">Two situations: someone says a rule does not work; stalling means defending it right away, learning means asking which step failed to produce the expected result. Someone shares a useful method; stalling means a retelling that drops their name, learning means keeping the author and original link.</desc>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#F8F7FC" class="f-bg"/>
    <rect x="24" y="78" width="752" height="150" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="40" y="122" width="200" height="62" rx="14" fill="#5B3FB8" class="f-block"/>
    <path d="M244 153 L270 153" fill="none" stroke="#6B607B" stroke-width="1.5" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M263.7 156.0 L270 153 L263.7 150.0" fill="none" stroke="#6B607B" stroke-width="1.5" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="274" y="122" width="222" height="62" rx="12" fill="#FCE7F2" stroke="#F25CAC" stroke-width="1.5" stroke-dasharray="5 4" class="f-pink-tint s-pink"/>
    <path d="M290 147 L302 159 M302 147 L290 159" fill="none" stroke="#F25CAC" stroke-width="3" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M500 153 L526 153" fill="none" stroke="#5B3FB8" stroke-width="2" class="s-block" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M519.7 156.0 L526 153 L519.7 150.0" fill="none" stroke="#5B3FB8" stroke-width="2" class="s-block" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="530" y="114" width="230" height="78" rx="8" fill="#EFEBFA" stroke="#6A52C2" stroke-width="1.5" class="f-hl s-accent"/>
    <rect x="536" y="122" width="5" height="62" rx="2.5" fill="#C6F432" class="f-lime"/>
    <rect x="24" y="248" width="752" height="150" rx="14" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="40" y="292" width="200" height="62" rx="14" fill="#5B3FB8" class="f-block"/>
    <path d="M244 323 L270 323" fill="none" stroke="#6B607B" stroke-width="1.5" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M263.7 326.0 L270 323 L263.7 320.0" fill="none" stroke="#6B607B" stroke-width="1.5" class="s-fg2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="274" y="292" width="222" height="62" rx="12" fill="#FCE7F2" stroke="#F25CAC" stroke-width="1.5" stroke-dasharray="5 4" class="f-pink-tint s-pink"/>
    <path d="M290 317 L302 329 M302 317 L290 329" fill="none" stroke="#F25CAC" stroke-width="3" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M500 323 L526 323" fill="none" stroke="#5B3FB8" stroke-width="2" class="s-block" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M519.7 326.0 L526 323 L519.7 320.0" fill="none" stroke="#5B3FB8" stroke-width="2" class="s-block" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="530" y="284" width="230" height="78" rx="8" fill="#EFEBFA" stroke="#6A52C2" stroke-width="1.5" class="f-hl s-accent"/>
    <rect x="536" y="292" width="5" height="62" rx="2.5" fill="#C6F432" class="f-lime"/>
  </g>
  <g id="text">
    <text x="28" y="50" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B607B" class="f-fg2">They</text>
    <text x="264" y="50" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B607B" class="f-fg2">Stalls</text>
    <text x="532" y="50" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B607B" class="f-fg2">Keeps learning</text>
    <text x="140.0" y="148.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle"><tspan x="140.0" dy="0">“The rule</tspan><tspan x="140.0" dy="20.2">doesn't work”</tspan></text>
    <text x="316" y="158.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg">Defend it right away</text>
    <text x="550" y="148.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#241B35" class="f-fg"><tspan x="550" dy="0">Ask which step failed to</tspan><tspan x="550" dy="20.2">give the expected result</tspan></text>
    <text x="140.0" y="328.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">Shares a useful method</text>
    <text x="316" y="318.1" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg"><tspan x="316" dy="0">Retelling drops</tspan><tspan x="316" dy="20.2">their name</tspan></text>
    <text x="550" y="318.1" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#241B35" class="f-fg"><tspan x="550" dy="0">Keep the author and</tspan><tspan x="550" dy="20.2">the original link</tspan></text>
    <text x="24" y="452" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B607B" class="f-fg2">Both stalls remove chances to learn together</text>
  </g>
</svg>