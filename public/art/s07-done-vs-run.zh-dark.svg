  <g id="text">
    <text x="60" y="70.3" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#EAE5F4" class="f-fg">只改了代码</text>
    <text x="456" y="70.3" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#EAE5F4" class="f-fg">启动并试一次</text>
