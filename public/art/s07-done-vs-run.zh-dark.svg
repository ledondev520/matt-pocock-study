<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s07-done-vs-run-title s07-done-vs-run-desc" class="svg-9670cba9-f7f8-47cd-af93-e37cbb6fad5b">
  <title id="s07-done-vs-run-title">「已经完成」vs 启动后试一次</title>
  <desc id="s07-done-vs-run-desc">左：agent 修改了代码并宣布完成，却没启动应用；你提交一次表单才发现缺少服务配置时界面仍显示成功。右：启动应用、提交一次表单，运行环境让这个错误在工作中及时暴露。</desc>
