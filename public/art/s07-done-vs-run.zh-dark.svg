    <text x="116" y="239.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#140C28" class="f-on-block">agent：已经完成</text>
    <text x="48" y="284" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#AEA4C0" class="f-fg2">没人启动应用</text>
    <text x="68" y="360.1" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="68" dy="0">你提交一次表单才发现：</tspan><tspan x="68" dy="20.2">缺少服务配置，仍显示成功</tspan></text>
    <text x="48" y="448" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#AEA4C0" class="f-fg2">代码存在，不等于行为成立</text>
    <text x="462" y="138.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">1</text>
    <text x="500" y="139.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg">启动应用</text>
    <text x="462" y="198.9" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">2</text>
    <text x="500" y="199.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg">提交一次表单</text>
    <text x="488" y="278.1" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="488" dy="0">缺少服务配置</tspan><tspan x="488" dy="20.2">界面仍显示成功</tspan></text>
    <text x="464" y="402.2" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#EAE5F4" class="f-fg">工作中就看见这个错误</text>
    <text x="444" y="448" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#AEA4C0" class="f-fg2">运行环境让错误及时暴露</text>
