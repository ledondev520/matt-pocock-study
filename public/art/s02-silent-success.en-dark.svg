<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s02-silent-success-title s02-silent-success-desc">
  <title id="s02-silent-success-title">Make false success visibly fail</title>
  <desc id="s02-silent-success-desc">A missing service address still shows sent: reproduce false success, reject invalid config, check invalid and valid paths, and review evidence for both configurations.</desc>
  <defs><clipPath id="s02-silent-success-clip1"><rect x="26" y="134" width="160" height="232" rx="14"/></clipPath><clipPath id="s02-silent-success-clip2"><rect x="222" y="134" width="160" height="232" rx="14"/></clipPath><clipPath id="s02-silent-success-clip3"><rect x="418" y="134" width="160" height="232" rx="14"/></clipPath><clipPath id="s02-silent-success-clip4"><rect x="614" y="134" width="160" height="232" rx="14"/></clipPath></defs>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#0E0A1F" class="f-bg"/>
    <rect x="26" y="38" width="301" height="42" rx="21" fill="#3A1A33" stroke="#F25CAC" stroke-width="1.5" class="f-pink-tint s-pink"/>
    <path d="M44 53 L56 65 M56 53 L44 65" fill="none" stroke="#F25CAC" stroke-width="3" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M106 80 L106 130" fill="none" stroke="#F25CAC" stroke-width="2" stroke-dasharray="5 5" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M102.1 121.9 L106 130 L109.9 121.9" fill="none" stroke="#F25CAC" stroke-width="2" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="26" y="134" width="160" height="232" rx="14" fill="#171128" class="f-card"/>
    <rect x="26" y="134" width="160" height="104" clip-path="url(#s02-silent-success-clip1)" fill="#A083F4" class="f-block"/>
    <rect x="26" y="134" width="160" height="232" rx="14" fill="none" stroke="#352A48" stroke-width="1.5" class="s-border"/>
    <path d="M192 186.0 L216 186.0" fill="none" stroke="#EAE5F4" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M207.9 189.9 L216 186.0 L207.9 182.1" fill="none" stroke="#EAE5F4" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="222" y="134" width="160" height="232" rx="14" fill="#171128" class="f-card"/>
    <rect x="222" y="134" width="160" height="104" clip-path="url(#s02-silent-success-clip2)" fill="#A083F4" class="f-block"/>
    <rect x="222" y="134" width="160" height="232" rx="14" fill="none" stroke="#352A48" stroke-width="1.5" class="s-border"/>
    <path d="M388 186.0 L412 186.0" fill="none" stroke="#EAE5F4" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M403.9 189.9 L412 186.0 L403.9 182.1" fill="none" stroke="#EAE5F4" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="418" y="134" width="160" height="232" rx="14" fill="#171128" class="f-card"/>
    <rect x="418" y="134" width="160" height="104" clip-path="url(#s02-silent-success-clip3)" fill="#A083F4" class="f-block"/>
    <rect x="418" y="134" width="160" height="232" rx="14" fill="none" stroke="#352A48" stroke-width="1.5" class="s-border"/>
    <path d="M584 186.0 L608 186.0" fill="none" stroke="#EAE5F4" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M599.9 189.9 L608 186.0 L599.9 182.1" fill="none" stroke="#EAE5F4" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="614" y="134" width="160" height="232" rx="14" fill="#171128" class="f-card"/>
    <rect x="614" y="134" width="160" height="104" clip-path="url(#s02-silent-success-clip4)" fill="#A083F4" class="f-block"/>
    <rect x="614" y="134" width="160" height="232" rx="14" fill="none" stroke="#352A48" stroke-width="1.5" class="s-border"/>
    <rect x="26" y="398" width="748" height="64" rx="14" fill="#C6F432" class="f-lime"/>
  </g>
  <g id="text">
    <text x="68" y="64.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg">Missing config → shows success</text>
    <text x="42" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">01</text>
    <text x="42" y="198.4" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block"><tspan x="42" dy="0">Reproduce</tspan><tspan x="42" dy="23.0">false success</tspan></text>
    <text x="42" y="272" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">At this layer</text>
    <text x="42" y="304" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="42" dy="0">No address, yet</tspan><tspan x="42" dy="21.6">shows sent</tspan></text>
    <text x="238" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">02</text>
    <text x="238" y="198.4" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block"><tspan x="238" dy="0">Reject invalid</tspan><tspan x="238" dy="23.0">configuration</tspan></text>
    <text x="238" y="272" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">At this layer</text>
    <text x="238" y="304" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="238" dy="0">Stop sending;</tspan><tspan x="238" dy="21.6">show failure</tspan></text>
    <text x="434" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">03</text>
    <text x="434" y="198.4" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block"><tspan x="434" dy="0">Check</tspan><tspan x="434" dy="23.0">both paths</tspan></text>
    <text x="434" y="272" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">At this layer</text>
    <text x="434" y="304" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="434" dy="0">No config: error</tspan><tspan x="434" dy="21.6">Valid: can send</tspan></text>
    <text x="630" y="164" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#140C28" class="f-on-block2">04</text>
    <text x="630" y="198.4" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#140C28" class="f-on-block"><tspan x="630" dy="0">Review</tspan><tspan x="630" dy="23.0">the evidence</tspan></text>
    <text x="630" y="272" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#AEA4C0" class="f-fg2">At this layer</text>
    <text x="630" y="304" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="500" fill="#EAE5F4" class="f-fg"><tspan x="630" dy="0">Both configs:</tspan><tspan x="630" dy="21.6">steps, logs, UI</tspan></text>
    <text x="50" y="435.2" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1A2110" class="f-on-lime">Done when</text>
    <text x="160" y="435.6" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="500" fill="#1A2110" class="f-on-lime">you can name the layer that stops this kind of bug</text>
  </g>
</svg>