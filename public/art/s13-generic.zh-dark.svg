    <text x="72" y="401.1" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="72" dy="0">关系丢了:</tspan><tspan x="72" dy="20.2">调用方拿不回原来的类型</tspan></text>
    <text x="544.0" y="131.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#EAE5F4" class="f-fg" text-anchor="middle">T</text>
    <text x="544.0" y="223.6" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#140C28" class="f-on-block" text-anchor="middle">echo&lt;T&gt;(value: T)</text>
    <text x="544.0" y="319.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#EAE5F4" class="f-fg" text-anchor="middle">T</text>
    <text x="478" y="401.1" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#1A2110" class="f-on-lime"><tspan x="478" dy="0">类型关系保留:</tspan><tspan x="478" dy="20.2">echo(12) 的类型是 12</tspan></text>
