<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s13-generic-title s13-generic-desc">
  <title id="s13-generic-title">泛型保留输入和输出的类型关系</title>
  <desc id="s13-generic-desc">左:echoWide(12) 返回 string | number,丢失具体类型;右:echo(12) 保留类型 12。这是原样返回函数的例子。</desc>
