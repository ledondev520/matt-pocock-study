  <g id="text">
    <text x="48" y="62" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#EAE5F4" class="f-fg">联合返回类型</text>
    <text x="432" y="62" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#EAE5F4" class="f-fg">泛型</text>
