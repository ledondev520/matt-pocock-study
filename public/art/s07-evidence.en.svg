<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s07-evidence-title s07-evidence-desc">
  <title id="s07-evidence-title">A fix needs two pieces of evidence</title>
  <desc id="s07-evidence-desc">Failure evidence → fix → passing evidence; both must be repeatable with a clear result.</desc>
  <g id="shapes">
    <rect id="bg" x="0" y="0" width="800" height="500" fill="#F8F7FC" class="f-bg"/>
    <rect x="24" y="48" width="250" height="280" rx="16" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="42" y="108" width="214" height="196" rx="10" fill="#241B35" class="f-term"/>
    <circle cx="60" cy="124" r="4.5" fill="#F25CAC" class="f-pink"/>
    <circle cx="76" cy="124" r="4.5" fill="#C6F432" class="f-lime"/>
    <circle cx="92" cy="124" r="4.5" fill="#DCD6E7" class="f-border"/>
    <circle cx="149" cy="262" r="20" fill="#F25CAC" class="f-pink"/>
    <path d="M142 255 L156 269 M156 255 L142 269" fill="none" stroke="#241B35" stroke-width="3" class="s-term" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="526" y="48" width="250" height="280" rx="16" fill="#FFFFFF" stroke="#DCD6E7" stroke-width="1.5" class="f-card s-border"/>
    <rect x="544" y="108" width="214" height="196" rx="10" fill="#241B35" class="f-term"/>
    <circle cx="562" cy="124" r="4.5" fill="#F25CAC" class="f-pink"/>
    <circle cx="578" cy="124" r="4.5" fill="#C6F432" class="f-lime"/>
    <circle cx="594" cy="124" r="4.5" fill="#DCD6E7" class="f-border"/>
    <circle cx="651" cy="262" r="20" fill="#5129C5" class="f-block"/>
    <path d="M643 262 L648.3 267.6 L659 255.6" fill="none" stroke="#FFFFFF" stroke-width="3" class="s-on-block" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="318" y="140" width="164" height="96" rx="16" fill="#5129C5" class="f-block"/>
    <path d="M278 188 L312 188" fill="none" stroke="#241B35" stroke-width="2.5" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M303.9 191.9 L312 188 L303.9 184.1" fill="none" stroke="#241B35" stroke-width="2.5" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M486 188 L520 188" fill="none" stroke="#241B35" stroke-width="2.5" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M511.9 191.9 L520 188 L511.9 184.1" fill="none" stroke="#241B35" stroke-width="2.5" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="190" y="372" width="198" height="52" rx="26" fill="#C6F432" class="f-lime"/>
    <path d="M212 398 L216.0 402.2 L224 393.2" fill="none" stroke="#1A2110" stroke-width="2.5" class="s-on-lime" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="412" y="372" width="198" height="52" rx="26" fill="#C6F432" class="f-lime"/>
    <path d="M434 398 L438.0 402.2 L446 393.2" fill="none" stroke="#1A2110" stroke-width="2.5" class="s-on-lime" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="text">
    <text x="46" y="86" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#241B35" class="f-fg">Failure evidence</text>
    <text x="58" y="166" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#EAE5F4" class="f-on-term">$ submit form</text>
    <text x="58" y="201.5" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#B9AFCB" class="f-term-dim"><tspan x="58" dy="0">No service address,</tspan><tspan x="58" dy="18.9">yet shows sent</tspan></text>
    <text x="548" y="86" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#241B35" class="f-fg">Passing evidence</text>
    <text x="560" y="166" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#EAE5F4" class="f-on-term">$ submit form</text>
    <text x="560" y="201.5" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#B9AFCB" class="f-term-dim"><tspan x="560" dy="0">No config → error</tspan><tspan x="560" dy="18.9">Valid config → sent</tspan></text>
    <text x="400.0" y="195.0" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">Fix</text>
    <text x="236" y="403.6" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1A2110" class="f-on-lime">Repeatable</text>
    <text x="458" y="403.6" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1A2110" class="f-on-lime">Clear pass or fail</text>
    <text x="400" y="460" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B607B" class="f-fg2" text-anchor="middle">Both runs must be repeatable with a clear result</text>
  </g>
</svg>