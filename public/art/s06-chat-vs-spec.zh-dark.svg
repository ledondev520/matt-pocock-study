    <text x="444" y="448" font-family="'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#AEA4C0" class="f-fg2">规格负责把决定传下去</text>
