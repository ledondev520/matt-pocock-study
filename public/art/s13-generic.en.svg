  </g>
  <g id="text">
    <text x="48" y="62" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#241B35" class="f-fg">Union return type</text>
    <text x="432" y="62" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#241B35" class="f-fg">Generic</text>
    <text x="160.0" y="129.6" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">12</text>
    <text x="160.0" y="223.9" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">echoWide(12)</text>
    <text x="160.0" y="317.6" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">string | number</text>
    <text x="72" y="401.1" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg"><tspan x="72" dy="0">Link lost: the caller</tspan><tspan x="72" dy="20.2">can’t get the type back</tspan></text>
    <text x="544.0" y="131.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#241B35" class="f-fg" text-anchor="middle">T</text>
    <text x="544.0" y="223.6" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#FFFFFF" class="f-on-block" text-anchor="middle">echo&lt;T&gt;(value: T)</text>
    <text x="544.0" y="319.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#241B35" class="f-fg" text-anchor="middle">T</text>
    <text x="478" y="401.1" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#1A2110" class="f-on-lime"><tspan x="478" dy="0">Type link kept:</tspan><tspan x="478" dy="20.2">echo(12) has type 12</tspan></text>
  </g>
</svg>