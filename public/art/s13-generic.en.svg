    <rect x="444" y="190" width="200" height="56" rx="12" fill="#5129C5" class="f-block"/>
    <path d="M544 250 L544 280" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M540.1 271.9 L544 280 L547.9 271.9" fill="none" stroke="#241B35" stroke-width="2" class="s-line" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="454" y="284" width="180" height="56" rx="12" fill="#F8F7FC" stroke="#DCD6E7" stroke-width="1.5" class="f-inner s-border"/>
