<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s13-generic-title s13-generic-desc">
  <title id="s13-generic-title">Generics preserve input and output type relationships</title>
  <desc id="s13-generic-desc">Left: echoWide(12) returns string | number and loses the specific type. Right: echo(12) retains type 12. This example is an identity function.</desc>
