    <path d="M254 124 C330 124 330 312 254 312" fill="none" stroke="#F25CAC" stroke-width="2.5" stroke-dasharray="6 5" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M304 210 L320 226 M320 210 L304 226" fill="none" stroke="#F25CAC" stroke-width="3.5" class="s-pink" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="368" width="320" height="76" rx="12" fill="#FCE7F2" stroke="#F25CAC" stroke-width="1.5" class="f-pink-tint s-pink"/>
    <rect x="454" y="96" width="180" height="56" rx="12" fill="#F8F7FC" stroke="#DCD6E7" stroke-width="1.5" class="f-inner s-border"/>
