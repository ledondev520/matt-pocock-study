  <title id="s15-boundary-check-title">Checking one boundary: inputs, outputs and failures</title>
  <desc id="s15-boundary-check-desc">One boundary with recurring failures defines its inputs, outputs and failure behaviour; domain failures are explicit types; tools reject imports that cross the boundary. Below, our suggested three steps: choose one failing boundary, define inputs, outputs and failures, then select a type or check that enforces it.</desc>
