    <text x="24" y="412" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#AEA4C0" class="f-fg2">Our suggestion</text>
    <text x="40" y="456.9" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAE5F4" class="f-fg">Pick one failing boundary</text>
    <text x="296" y="447.4" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="296" dy="0">Define inputs,</tspan><tspan x="296" dy="18.9">outputs, failures</tspan></text>
    <text x="552" y="447.4" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAE5F4" class="f-fg"><tspan x="552" dy="0">Then pick a type</tspan><tspan x="552" dy="18.9">or a check</tspan></text>
