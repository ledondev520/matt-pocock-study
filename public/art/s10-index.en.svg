    <text x="92" y="240.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg">Folders</text>
    <text x="92" y="282.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg">Rare rules</text>
    <text x="92" y="324.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg">Repeated reminders</text>
    <text x="90" y="401.1" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg"><tspan x="90" dy="0">Every task loads all of it;</tspan><tspan x="90" dy="20.2">duplicates go stale</tspan></text>
    <text x="424" y="62" font-family="'Space Grotesk',Inter,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#241B35" class="f-fg">Navigation</text>
    <text x="436" y="108.2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#241B35" class="f-fg">AGENTS.md</text>
    <text x="436" y="153.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg">X task → read x.md</text>
    <text x="714.0" y="153.2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">x.md</text>
    <text x="436" y="189.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg">Y task → read y.md</text>
    <text x="714.0" y="189.2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">y.md</text>
    <text x="436" y="225.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#241B35" class="f-fg">Z task → read z.md</text>
    <text x="714.0" y="225.2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">z.md</text>
    <text x="714" y="254" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2" text-anchor="middle"><tspan x="714" dy="0">next to its</tspan><tspan x="714" dy="18.9">topic</tspan></text>
