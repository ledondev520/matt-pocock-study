<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s10-index-title s10-index-desc">
  <title id="s10-index-title">AGENTS.md: an index, not a dump</title>
  <desc id="s10-index-desc">Left: everything crammed into a long AGENTS.md. Right: a short AGENTS.md that says which file to read for which task; commands and deps come from real config.</desc>
