    <text x="74" y="405.6" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#241B35" class="f-fg">Status</text>
    <text x="285.0" y="405.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle">Superseded</text>
    <text x="568" y="329.9" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#FFFFFF" class="f-on-block">Replacement ADR</text>
    <text x="568" y="382" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#6B607B" class="f-fg2">Status</text>
    <text x="628.0" y="419.2" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#1A2110" class="f-on-lime" text-anchor="middle">Accepted</text>
    <text x="654.0" y="259.1" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#241B35" class="f-fg" text-anchor="middle"><tspan x="654.0" dy="0">When superseded,</tspan><tspan x="654.0" dy="20.2">name the successor</tspan></text>
    <text x="568" y="100.8" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#241B35" class="f-fg"><tspan x="568" dy="0">Temporary plans</tspan><tspan x="568" dy="21.6">live elsewhere</tspan></text>
    <text x="456" y="96" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#6B607B" class="f-fg2">≠</text>
    <text x="400" y="478" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B607B" class="f-fg2" text-anchor="middle">Field list written by this site</text>
