<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="s12-adr-fields-title s12-adr-fields-desc">
  <title id="s12-adr-fields-title">The five fields of an ADR</title>
  <desc id="s12-adr-fields-desc">An ADR records context, decision, rationale, consequences and status; when superseded, it says by what. Temporary plans live elsewhere.</desc>
