# /etc/ssh/sshd_config.d/60-matt-deploy.conf
# The Matt deploy user can only run the deploy gate: no shell, no forwarding, no tty.
Match User mattdeploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand /usr/local/sbin/matt-deploy-gate
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
