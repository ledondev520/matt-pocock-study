# CI: lint → typecheck → test → build, plus secret detection.
# Job names are used as required status checks on main; rename them together with the ruleset.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Copyright overlap guard (skips when no raw corpus is present)
        run: node scripts/check-overlap.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Generated files exist
        run: |
          test -s dist/llms.txt
          test -s dist/llms-full.txt
          test -s dist/zh/llms.txt
          test -s dist/zh/llms-full.txt

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  layout:
    name: Layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: No page scrolls horizontally at 320, 390 and 1440px (light and dark)
        run: npm run test:layout

  data-pr-allowlist:
    name: Data PR allowlist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          scripts/ci/data-pr-allowlist.sh "$BASE" "$HEAD" | tee "$RUNNER_TEMP/classify.txt"
          allowlisted=$(sed -n 's/^allowlisted=//p' "$RUNNER_TEMP/classify.txt")
          touches=$(sed -n 's/^touches_data=//p' "$RUNNER_TEMP/classify.txt")
          sync=false
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [[ $HEAD_REF =~ ^sync/knowledge-[A-Za-z0-9._-]+$ ]]; then sync=true; fi
          echo "touches_data=$touches" >> "$GITHUB_OUTPUT"
          {
            echo "### Data PR allowlist"
            echo "- only allow-listed data files changed: $allowlisted"
            echo "- sync branch: $sync"
            if [ "$allowlisted" = true ] && [ "$sync" = true ]; then
              echo "- eligible for auto-merge once every required check is green"
            else
              echo "- not eligible for auto-merge: needs the usual independent review"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A sync branch exists only to carry data; anything else on it is an error.
          if [ "$sync" = true ] && [ "$allowlisted" != true ]; then
            echo "::error::sync/knowledge-* PRs may only modify allow-listed data files in place"
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.classify.outputs.touches_data == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Re-run the privacy gate and format check on the data
        if: steps.classify.outputs.touches_data == 'true'
        env:
          KB_DENYLIST: ${{ secrets.KB_DENYLIST }}
        run: |
          set -euo pipefail
          git checkout -q --detach "${{ github.event.pull_request.head.sha }}"
          npm ci
          npx tsx scripts/ci/check-kb-data.ts
