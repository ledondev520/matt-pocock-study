# Auto-merge is only for knowledge-base data PRs: a same-repository sync/knowledge-* branch that
# modifies allow-listed data files in place (scripts/ci/data-pr-allowlist.sh). The sync script
# turns auto-merge on with the maintainer's own token, so the merge triggers CI and Deploy.
# This guard turns auto-merge off on every other PR. It uses pull_request (not
# pull_request_target), so fork PRs get a read-only token and simply cannot have auto-merge.

name: Auto-merge guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, auto_merge_enabled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-merge-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Auto-merge guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Disable auto-merge unless the PR is a data-only sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
        run: |
          set -euo pipefail
          eligible=false
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [[ $HEAD_REF =~ ^sync/knowledge-[A-Za-z0-9._-]+$ ]]; then
            result=$(scripts/ci/data-pr-allowlist.sh "$BASE" "$HEAD")
            echo "$result"
            if grep -qx 'allowlisted=true' <<< "$result"; then eligible=true; fi
          fi
          echo "eligible=$eligible auto_merge=$AUTO_MERGE"
          if [ "$eligible" != true ] && [ "$AUTO_MERGE" = true ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
            echo "::warning::Auto-merge disabled: only data-only sync/knowledge-* PRs may auto-merge."
          fi
